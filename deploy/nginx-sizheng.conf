# 思政教学服务 nginx 配置 —— 服务器 82.156.215.199
# 对外路径与旧服务器保持一致:/sizheng2/api/ -> 9000, /sizheng2/resource/ -> 9001
# 安装位置: /etc/nginx/sites-available/sizheng

server {
    listen 80;
    server_name _;

    location = / {
        return 302 /sizheng2/;
    }

    location = /sizheng2 {
        return 308 /sizheng2/;
    }

    # 模型 API (uvicorn :9000) —— SSE 流式输出,必须关 buffering
    location /sizheng2/api/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 8m;
    }

    # 资源 API (uvicorn :9001)
    location /sizheng2/resource/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 联调页面:nginx 直接托管静态文件
    location /sizheng2/ {
        alias /data/sizheng2/teaching_model_service/debug_frontend/;
        index index.html;
    }
}
