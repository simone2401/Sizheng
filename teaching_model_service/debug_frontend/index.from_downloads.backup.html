<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teaching Model API 联调面板</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      background: #0b1020;
      color: #e8edff;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 18px; }
    .card {
      background: #111834;
      border: 1px solid #2b376e;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 20px; }
    h2 { margin: 0 0 10px; font-size: 15px; color: #b8c7ff; }
    .grid { display: grid; gap: 10px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    label { display: block; font-size: 12px; color: #b8c7ff; margin-bottom: 4px; }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #3b4a8f;
      border-radius: 8px;
      background: #0c1430;
      color: #e8edff;
      padding: 8px 10px;
      font-size: 14px;
    }
    textarea { min-height: 84px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button { cursor: pointer; background: #1a2a6f; }
    button.secondary { background: #2f3558; }
    .status {
      padding: 8px 10px;
      border-radius: 8px;
      background: #1a2145;
      border: 1px solid #445299;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .split { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    .pane {
      border: 1px solid #3b4a8f;
      border-radius: 8px;
      min-height: 220px;
      max-height: 400px;
      overflow: auto;
      background: #0a122f;
      padding: 10px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .small { font-size: 12px; color: #a7b3df; }
    .muted { color: #8ea0df; }
    .mini-btn {
      width: auto; display: inline-block; margin-left: 6px; padding: 2px 10px;
      font-size: 12px; vertical-align: middle;
    }

    /* ===== 教案预览排版（类 Word 文档效果）===== */
    .lesson-doc { background: #fff; color: #111; font-family: "Times New Roman", "SimSun", 宋体, serif; line-height: 1.75; }
    .lesson-doc h1 { font-family: "SimHei", 黑体, sans-serif; font-size: 20px; text-align: center; margin: 20px 0 10px; }
    .lesson-doc h2 { font-family: "SimHei", 黑体, sans-serif; font-size: 17px; margin: 16px 0 8px; text-align: center; }
    .lesson-doc h3 { font-family: "SimHei", 黑体, sans-serif; font-size: 15px; margin: 12px 0 6px; }
    .lesson-doc h4 { font-family: "SimHei", 黑体, sans-serif; font-size: 14px; margin: 10px 0 4px; }
    .lesson-doc p { margin: 6px 0; }
    .lesson-doc ul, .lesson-doc ol { margin: 6px 0; padding-left: 2em; }
    .lesson-doc li { margin: 3px 0; }
    .lesson-doc strong { font-family: "SimHei", 黑体, sans-serif; font-weight: bold; }
    .lesson-doc table { border-collapse: collapse; width: 100%; margin: 10px 0; table-layout: fixed; }
    .lesson-doc th, .lesson-doc td { border: 1px solid #333; padding: 6px 8px; font-size: 13px; text-align: left; vertical-align: top; word-break: break-all; }
    .lesson-doc th { background: #f2f2f2; font-family: "SimHei", 黑体, sans-serif; }
    .lesson-doc hr { border: none; border-top: 1px solid #999; margin: 12px 0; }

    @media print {
      body.print-mode * { visibility: hidden; }
      body.print-mode #contentPreview, body.print-mode #contentPreview * { visibility: visible; }
      body.print-mode #contentPreview {
        position: absolute; left: 0; top: 0; width: 100%;
        display: block !important; max-height: none !important; overflow: visible !important;
        border: none; padding: 0; background: #fff;
      }
    }
    @media (max-width: 920px) {
      .grid.cols-2, .grid.cols-3, .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Teaching Model API 联调面板（独立临时工具）</h1>

    <div class="card">
      <h2>连接配置</h2>
      <div class="grid cols-3">
        <div>
          <label>模型 API 地址</label>
          <input id="baseUrl" value="http://127.0.0.1:8000" />
        </div>
        <div>
          <label>API Key（Bearer）</label>
          <input id="apiKey" placeholder="local-model-key" />
        </div>
        <div>
          <label>超时（分钟）</label>
          <input id="timeoutMin" type="number" min="1" max="60" value="10" />
        </div>
      </div>
      <p class="small">流式请求默认可等待 10 分钟；你可以改成更长（最多 60 分钟）。</p>
    </div>

    <div class="card">
      <h2>请求参数</h2>
      <div class="grid cols-3" style="margin-bottom: 10px;">
        <div>
          <label>请求模板</label>
          <select id="requestTemplate">
            <option value="lesson_plan_assist">备课助手模板</option>
            <option value="case_guide_study">案例导引模板</option>
          </select>
        </div>
        <div style="align-self: end;">
          <button id="btnApplyTemplate" type="button">应用模板</button>
        </div>
      </div>

      <div class="grid cols-3">
        <div>
          <label>模型</label>
          <select id="modelSelect">
            <option>glm-5.2</option>
            <option>glm-5.3-flash</option>
            <option>glm-4.5</option>
            <option value="__custom__">自定义...</option>
          </select>
        </div>
        <div>
          <label>自定义模型（可空）</label>
          <input id="modelCustom" placeholder="例如 glm-5.2" />
        </div>
        <div>
          <label>chatType</label>
          <select id="chatType">
            <option value="lesson_plan_assist">lesson_plan_assist</option>
            <option value="case_guide_study">case_guide_study</option>
          </select>
        </div>
      </div>

      <div class="grid cols-2" style="margin-top: 10px;">
        <div><label>schoolLevel</label><input id="schoolLevel" value="8年级上" /></div>
        <div><label>subject</label><input id="subject" value="物理" /></div>
        <div><label>textbookVersion</label><input id="textbookVersion" value="人教版" /></div>
        <div><label>chapter（选章后联动出该章的节）</label><select id="chapter"></select></div>
        <div><label>lesson（选节后自动填知识点）</label><select id="lesson"></select></div>
        <div><label>knowledgePoints（选节自动填充，可手动删改）</label><input id="knowledgePoints" value="" /></div>
      </div>

      <div style="margin-top: 10px;">
        <label>教师输入（最后一条 USER）</label>
        <textarea id="userText">请生成课程思政教学设计教案</textarea>
      </div>

      <div class="row" style="margin-top: 10px;">
        <button id="btnStream">发起流式请求（SSE）</button>
        <button id="btnJson" class="secondary">发起非流式请求（JSON）</button>
        <button id="btnStop" class="secondary">中止请求</button>
      </div>
    </div>

    <div class="card">
      <h2>运行状态</h2>
      <div id="status" class="status">等待请求...</div>
      <div class="split" style="margin-top: 10px;">
        <div>
          <div class="small muted">reasoning_content（实时）</div>
          <div id="reasoning" class="pane"></div>
        </div>
        <div>
          <div class="small muted">content（实时）
            <button id="btnPreview" type="button" class="mini-btn">预览</button>
            <button id="btnPrint" type="button" class="mini-btn">打印 / PDF</button>
          </div>
          <div id="content" class="pane"></div>
          <div id="contentPreview" class="pane lesson-doc" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script>
    let controller = null;
    let startedAt = 0;

    const els = {
      baseUrl: document.getElementById("baseUrl"),
      apiKey: document.getElementById("apiKey"),
      timeoutMin: document.getElementById("timeoutMin"),
      modelSelect: document.getElementById("modelSelect"),
      modelCustom: document.getElementById("modelCustom"),
      chatType: document.getElementById("chatType"),
      requestTemplate: document.getElementById("requestTemplate"),
      btnApplyTemplate: document.getElementById("btnApplyTemplate"),
      schoolLevel: document.getElementById("schoolLevel"),
      subject: document.getElementById("subject"),
      textbookVersion: document.getElementById("textbookVersion"),
      chapter: document.getElementById("chapter"),
      lesson: document.getElementById("lesson"),
      knowledgePoints: document.getElementById("knowledgePoints"),
      userText: document.getElementById("userText"),
      status: document.getElementById("status"),
      reasoning: document.getElementById("reasoning"),
      content: document.getElementById("content"),
      contentPreview: document.getElementById("contentPreview"),
      btnPreview: document.getElementById("btnPreview"),
      btnPrint: document.getElementById("btnPrint"),
      btnStream: document.getElementById("btnStream"),
      btnJson: document.getElementById("btnJson"),
      btnStop: document.getElementById("btnStop"),
    };

    // 教材章节树：与 json_output/PEP8U_PHYSICS/entities.json 同步生成（6章28节）
    const TEXTBOOK_TREE = {
      "第一章 机械运动": {
        "第1节 长度和时间的测量": ["长度的单位", "刻度尺的使用", "时间的测量", "测量误差"],
        "第2节 运动的描述": ["机械运动", "参照物与运动描述", "运动和静止的相对性"],
        "第3节 运动的快慢": ["速度", "速度的计算", "平均速度与运动快慢的比较", "运动图像"],
        "第4节 速度的测量": ["实验：测量平均速度", "区间测速与交通规则", "超声测距与智能技术"]
      },
      "第二章 声现象": {
        "第1节 声音的产生与传播": ["声音的产生", "声音的传播", "声速", "骨传导与应用"],
        "第2节 声音的特性": ["音调", "响度", "音色", "乐器分类与贾湖骨笛"],
        "第3节 声的利用": ["声与信息", "声与能量", "中国古代建筑声学", "音乐公路"],
        "第4节 噪声的危害和控制": ["噪声及其等级", "噪声的危害", "控制噪声的途径", "防噪声耳罩设计"],
        "第5节 跨学科实践：制作隔音房间模型": ["隔音原理与材料选择", "模型制作与测试", "方案评价与听力健康"]
      },
      "第三章 物态变化": {
        "第1节 温度": ["温度与温度计原理", "温度计的正确使用", "生活温度调查", "测温技术发展"],
        "第2节 熔化和凝固": ["熔化和凝固的概念", "探究固体熔化时温度变化规律", "晶体与非晶体", "物态变化的应用"],
        "第3节 汽化和液化": ["汽化和液化", "探究水沸腾时温度变化特点", "蒸发及其影响因素", "液化与生活安全", "青藏铁路冻土热管"],
        "第4节 升华和凝华": ["升华和凝华", "升华凝华现象辨析", "水资源保护与节水行动"],
        "第5节 跨学科实践：探索厨房中的物态变化问题": ["厨房中的物态变化辨识", "节能与安全用能建议", "家庭实验设计与安全边界"]
      },
      "第四章 光现象": {
        "第1节 光的直线传播": ["光源与光的直线传播", "影子、日食与月食", "光速与科学测量"],
        "第2节 光的反射": ["光的反射定律", "探究光的反射规律", "镜面反射与漫反射", "光污染与用眼健康", "激光测距"],
        "第3节 平面镜成像": ["平面镜成像特点", "平面镜成像的应用", "古代铜镜", "太阳灶与节能", "京剧艺术中的平面镜情境"],
        "第4节 光的折射": ["光的折射现象与规律", "折射的光路作图与现象解释", "海市蜃楼与古籍记载"],
        "第5节 光的色散": ["光的色散", "白光的组成与色光混合", "红外线及其应用", "紫外线及其应用"]
      },
      "第五章 透镜及其应用": {
        "第1节 透镜": ["透镜及其分类", "透镜对光的作用", "焦点与焦距", "古代冰透镜取火", "凸透镜会聚与防火安全"],
        "第2节 生活中的透镜": ["照相机与数码成像", "投影仪", "放大镜"],
        "第3节 凸透镜成像的规律": ["凸透镜成像规律的实验探究", "凸透镜成像规律的应用"],
        "第4节 眼睛和眼镜": ["眼睛与视觉形成", "近视与远视的成因及矫正", "科学用眼", "全国爱眼日与公益行动"],
        "第5节 跨学科实践：制作望远镜": ["望远镜的原理与方案设计", "制作、调试与工程评价", "望远镜与天文观测史", "中国天眼"]
      },
      "第六章 质量与密度": {
        "第1节 质量": ["质量及其单位", "战国天平与测量史", "天平的使用与计量规范", "千克定义的演进"],
        "第2节 密度": ["密度概念的建立", "密度公式与单位", "密度与物质鉴别", "密度知识的生活安全应用"],
        "第3节 测量液体和固体的密度": ["量筒的使用", "测量液体的密度", "测量固体的密度", "异常数据与科学发现"],
        "第4节 密度的应用": ["密度与材料选择", "碑心石质量估算", "新材料与科技发展", "古代冶铁与黄河铁牛"]
      }
    };

    function fillLessons(chapterName, preferredLesson) {
      els.lesson.innerHTML = "";
      const lessons = Object.keys(TEXTBOOK_TREE[chapterName] || {});
      lessons.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        els.lesson.appendChild(opt);
      });
      if (preferredLesson && lessons.includes(preferredLesson)) {
        els.lesson.value = preferredLesson;
      } else if (lessons.length) {
        els.lesson.value = lessons[0];
      }
      fillKnowledgePoints();
    }

    function fillKnowledgePoints() {
      const kps = (TEXTBOOK_TREE[els.chapter.value] || {})[els.lesson.value] || [];
      els.knowledgePoints.value = kps.join(",");
    }

    function setChapterAndLesson(chapterName, lessonName) {
      els.chapter.value = chapterName;
      fillLessons(chapterName, lessonName);
    }

    Object.keys(TEXTBOOK_TREE).forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      els.chapter.appendChild(opt);
    });
    els.chapter.addEventListener("change", () => fillLessons(els.chapter.value));
    els.lesson.addEventListener("change", fillKnowledgePoints);
    setChapterAndLesson("第六章 质量与密度", "第4节 密度的应用");

    const templates = {
      lesson_plan_assist: {
        chatType: "lesson_plan_assist",
        schoolLevel: "8年级上",
        subject: "物理",
        textbookVersion: "人教版",
        chapter: "第六章 质量与密度",
        lesson: "第4节 密度的应用",
        userText: "请生成课程思政教学设计教案，突出实验探究与价值引导。",
      },
      case_guide_study: {
        chatType: "case_guide_study",
        schoolLevel: "8年级上",
        subject: "物理",
        textbookVersion: "人教版",
        chapter: "第六章 质量与密度",
        lesson: "第4节 密度的应用",
        userText: "请继续案例导引学习，从学生常见误区切入，每轮只问一个关键问题。",
      },
    };

    function setStatus(text) {
      const sec = startedAt ? ((Date.now() - startedAt) / 1000).toFixed(1) : "0.0";
      els.status.textContent = `[${new Date().toLocaleTimeString()} | ${sec}s]\n${text}`;
    }

    function chosenModel() {
      if (els.modelSelect.value === "__custom__") {
        return els.modelCustom.value.trim() || null;
      }
      return els.modelCustom.value.trim() || els.modelSelect.value;
    }

    function buildPayload(stream) {
      const kp = els.knowledgePoints.value
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);

      const metadata = {
        chatType: els.chatType.value,
        schoolLevel: els.schoolLevel.value.trim(),
        subject: els.subject.value.trim(),
        textbookVersion: els.textbookVersion.value.trim(),
        chapter: els.chapter.value.trim(),
        lesson: els.lesson.value.trim(),
      };

      if (els.chatType.value === "lesson_plan_assist" && kp.length) {
        metadata.knowledgePoints = kp;
      }

      return {
        model: chosenModel(),
        stream,
        turnId: 1,
        messages: [
          {
            role: "USER",
            content: [{ type: "TEXT", text: els.userText.value.trim() }],
          },
        ],
        metadata,
      };
    }

    function clearOutput() {
      els.reasoning.textContent = "";
      els.content.textContent = "";
      els.contentPreview.innerHTML = "";
    }

    function applyTemplate(templateKey) {
      const template = templates[templateKey];
      if (!template) return;
      els.chatType.value = template.chatType;
      els.schoolLevel.value = template.schoolLevel;
      els.subject.value = template.subject;
      els.textbookVersion.value = template.textbookVersion;
      els.chapter.value = template.chapter;
      els.lesson.value = template.lesson;
      fillKnowledgePoints();
      els.userText.value = template.userText;
      setStatus(`已应用模板：${templateKey}`);
    }

    function appendReasoning(text) {
      if (!text) return;
      els.reasoning.textContent += text;
      els.reasoning.scrollTop = els.reasoning.scrollHeight;
    }

    function appendContent(text) {
      if (!text) return;
      els.content.textContent += text;
      els.content.scrollTop = els.content.scrollHeight;
      if (previewMode) renderPreview();
    }

    // ===== 教案预览（Markdown 渲染）=====
    let previewMode = false;

    function renderPreview() {
      const raw = els.content.textContent;
      els.contentPreview.innerHTML = raw.trim()
        ? marked.parse(raw)
        : '<p style="color:#999">（暂无内容，先发起一次请求）</p>';
      els.contentPreview.scrollTop = els.contentPreview.scrollHeight;
    }

    function setPreviewMode(on) {
      previewMode = on;
      els.contentPreview.style.display = on ? "block" : "none";
      els.content.style.display = on ? "none" : "block";
      els.btnPreview.textContent = on ? "原文" : "预览";
      if (on) renderPreview();
    }

    els.btnPreview.addEventListener("click", () => setPreviewMode(!previewMode));
    els.btnPrint.addEventListener("click", () => {
      if (!previewMode) setPreviewMode(true); else renderPreview();
      document.body.classList.add("print-mode");
      window.print();
    });
    window.addEventListener("afterprint", () => document.body.classList.remove("print-mode"));

    function consumeSseBuffer(buffer, state) {
      let rest = buffer;
      let idx;
      while ((idx = rest.indexOf("\n\n")) >= 0) {
        const rawEvent = rest.slice(0, idx);
        rest = rest.slice(idx + 2);

        const lines = rawEvent.split("\n");
        for (const line of lines) {
          if (line.startsWith(":")) {
            setStatus("连接保持中（收到 keepalive ping）...");
            continue;
          }
          if (!line.startsWith("data:")) continue;
          const raw = line.slice(5).trim();
          if (!raw) continue;

          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            continue;
          }

          appendReasoning(payload.reasoning_content || "");
          appendContent(payload.content || "");

          if (payload.finishReason) {
            state.terminal = payload;
          }
        }
      }
      return rest;
    }

    async function callJson() {
      stopCurrent();
      startedAt = Date.now();
      clearOutput();
      setStatus("正在发送非流式请求...");

      const payload = buildPayload(false);
      const headers = { "Content-Type": "application/json" };
      const key = els.apiKey.value.trim();
      if (key) headers.Authorization = `Bearer ${key}`;

      controller = new AbortController();
      const timeoutMs = Math.max(1, Math.min(60, Number(els.timeoutMin.value) || 10)) * 60 * 1000;
      const timer = setTimeout(() => controller?.abort("请求超时"), timeoutMs);

      try {
        const res = await fetch(`${els.baseUrl.value.trim()}/v1/chat/teaching`, {
          method: "POST",
          headers,
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus(`请求失败: HTTP ${res.status}\n${JSON.stringify(data, null, 2)}`);
          return;
        }
        appendReasoning(data.reasoning_content || "");
        appendContent(data.content || "");
        setStatus(`完成（非流式）\nfinishReason=${data.finishReason} model=${data.model || ""}`);
      } catch (err) {
        setStatus(`请求异常：${err?.message || err}`);
      } finally {
        clearTimeout(timer);
        controller = null;
      }
    }

    async function callStream() {
      stopCurrent();
      startedAt = Date.now();
      clearOutput();
      setStatus("正在建立流式连接...");

      const payload = buildPayload(true);
      const headers = { "Content-Type": "application/json" };
      const key = els.apiKey.value.trim();
      if (key) headers.Authorization = `Bearer ${key}`;

      controller = new AbortController();
      const timeoutMs = Math.max(1, Math.min(60, Number(els.timeoutMin.value) || 10)) * 60 * 1000;
      const timer = setTimeout(() => controller?.abort("流式请求超时"), timeoutMs);

      try {
        const response = await fetch(`${els.baseUrl.value.trim()}/v1/chat/teaching`, {
          method: "POST",
          headers,
          body: JSON.stringify(payload),
          signal: controller.signal,
        });

        if (!response.ok) {
          const text = await response.text();
          setStatus(`流式请求失败: HTTP ${response.status}\n${text}`);
          return;
        }

        if (!response.body) {
          setStatus("浏览器不支持可读流 response.body");
          return;
        }

        setStatus("已连接，正在接收流式数据...");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        const streamState = { terminal: null };

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          buffer = consumeSseBuffer(buffer, streamState);
        }

        buffer += decoder.decode();
        buffer = consumeSseBuffer(buffer, streamState);
        if (buffer.trim().startsWith("data:")) {
          buffer = consumeSseBuffer(`${buffer}\n\n`, streamState);
        }

        if (streamState.terminal) {
          setStatus(`流式完成\nfinishReason=${streamState.terminal.finishReason} model=${streamState.terminal.model || ""}`);
        } else {
          const hasOutput = Boolean(els.reasoning.textContent || els.content.textContent);
          setStatus(hasOutput ? "流式结束（连接关闭，未显式返回终止块）" : "流式结束（未收到终止块 finishReason）");
        }
      } catch (err) {
        setStatus(`流式异常：${err?.message || err}`);
      } finally {
        clearTimeout(timer);
        controller = null;
      }
    }

    function stopCurrent() {
      if (controller) {
        controller.abort("用户手动中止");
        controller = null;
      }
    }

    els.btnStream.addEventListener("click", callStream);
    els.btnJson.addEventListener("click", callJson);
    els.btnApplyTemplate.addEventListener("click", () => applyTemplate(els.requestTemplate.value));
    els.btnStop.addEventListener("click", () => {
      stopCurrent();
      setStatus("已手动中止请求。");
    });

    applyTemplate(els.requestTemplate.value);
  </script>
</body>
</html>
