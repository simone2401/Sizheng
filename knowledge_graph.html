0, "text": "120 物理 八年级上册 投影仪的镜头是一个凸透镜，来自投影片（物体） 的光，通过凸透镜后会聚在天花板上，形成图案的像。物体离投影仪镜头比较近，像是放大、倒立的。现在会议室、教室用的投影仪（图 5.2-5） ，通常 与计算机相连，计算机上的字或图通过投影仪被放大， 其原理和上面介绍的投影仪类似。放大镜 生活中常用的放大镜也是一个凸透镜，它是最常用 的光学仪器之一。把放大镜放在物体跟眼睛之间，适当 调整距离，我们就能看清物体的细微之处。这时我们看 到的像是放大、正立的（图5.2-6）。实像和虚像 照相机和投影仪所成的像，是光通过凸透镜后会聚 而成的。如果把光屏放在像的位置，就能够承接到所成 的像。这种像叫作实像。凸透镜所成的实像是来自物体 的光会聚而成的，它和物体分别位于凸透镜的两侧（图 5.2-7）。平面镜所成的像是虚像，放大镜所成的像也是虚 像。凸透镜成虚像时，通过凸透镜出射的光没有会聚， 图5.2-6 放大镜成像 图5.2-5 便携式投影仪 图5.2-7 凸透镜成实像的情景 F A A′ F"}}, {"id": "PEP8U_PHYSICS_05_02_P121_1", "label": "P121 2_P121_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_02", "chunk_id": "PEP8U_PHYSICS_05_02_P121_1", "page": 121, "text": "第五章 透镜及其应用 121 光屏不能承接到所成的像。只是人眼逆着出射光的方向 看去，感到光是从虚像的位置发出的，物体和虚像位于 凸透镜的同侧（图 5.2-8）。1 照相机的镜头相当于一个凸透镜，图 5.2-2 甲中的 树在照相机的胶片上所成的像有什么特点？2 凸透镜是很多光学仪器的主要元件。请说出照相 机、投影仪所成的像都有哪些相同点和不同点。3 许多博物馆会在较为精巧的文物前放置凸透镜，如 图 5.2-9 所示。通过凸透镜看到的像是什么样的？像在凸透镜的哪一侧？4 请你说一说，在使用本节“想想做做”中自制的 模型照相机时，如果想让像变大一些，应该怎么  操作？5 生活中我们看到的像，有实像也有虚像。例如，电 影幕布上的像是实像，镜子中的像是虚像。请你再 各举出一个生活中能看到的实像和虚像的例子。图5.2-9 练习与应用 F F 图5.2-8 凸透镜成虚像的情景"}}, {"id": "PEP8U_PHYSICS_05_03_P122_1", "label": "P122 3_P122_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_03", "chunk_id": "PEP8U_PHYSICS_05_03_P122_1", "page": 122, "text": "122 物理 八年级上册 第 3 节 凸透镜成像的规律 照相机和投影仪都成倒立的实像，所不同的是：物 体通常离照相机的镜头比较远，成缩小的实像；物体离 投影仪的镜头比较近，成放大的实像。物体离放大镜比 较近，成放大、正立的虚像。可见，像的虚实、大小、 正倒与物体到凸透镜的距离（物距）有关系。像的虚实、大小、正倒与物距有怎样的关系呢？探究凸透镜成像的规律 实验思路 为探究凸透镜成像的规律，我们可以把物体放在距凸透镜较远的地方，然 后逐渐移近（图 5.3-1） ，把每次观察到的物距以及像的虚实、大小、正倒等 情况都记录在表格中，比较实验数据，看看像的虚实、大小、正倒与物距有什 么关系，寻找其中的规律。通过前面的学习，我们已经看到了形形色色的凸透 镜成像情况。凸透镜成像究竟有什么规律呢？问 题 图5.3-1 实验思路示意图 O F  f  ࡞  ͼ 实 验"}}, {"id": "PEP8U_PHYSICS_05_03_P123_1", "label": "P123 3_P123_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_03", "chunk_id": "PEP8U_PHYSICS_05_03_P123_1", "page": 123, "text": "第五章 透镜及其应用 123 实验过程 用发光二极管作为发光物体，一块白色的硬纸板作为光屏，调节发光物 体、凸透镜和光屏，使它们的中心高度相同，研究发光物体的成像情况（图 5.3-2）。把发光物体放在较远处，移动光屏，使光屏上呈现清晰的实像。观察实像 的大小和正倒，测出物距和像距（像到凸透镜的距离） 。把发光物体向凸透镜移近几厘米，放好后重复以上操作。继续向凸透镜移动发光物体并调整光屏的位置，重复以上操作，你总能在 光屏上得到发光物体的像吗？当在光屏上看不到发光物体的像时，可以撤去光 屏，从光屏一侧向凸透镜方向看去，观察发光物体的像。此时发光物体和它的 像在什么位置？记录凸透镜的焦距 f，把实验中得到的数据和观察的结果填入下表。每个 小组可以自己选择适当的物距，并与各小组共享测量的数据。图5.3-2 探究凸透镜成像规律的装置 物距/cm 像的性质 像距/cm 虚实 大小 正倒 1002 03 04 05 06 07 08 09 0 100cm"}}, {"id": "PEP8U_PHYSICS_05_03_P124_1", "label": "P124 3_P124_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_03", "chunk_id": "PEP8U_PHYSICS_05_03_P124_1", "page": 124, "text": "124 物理 八年级上册 实验结论 分析上表的记录，回答下列问题，找出凸透镜成像的规律。1. 像的虚实：凸透镜在什么条件下成实像？在什么条件下成虚像？2. 像的大小：凸透镜在什么条件下成缩小的实像？在什么条件下成放大 的实像？有没有缩小的虚像？3. 像的正倒：凸透镜在什么条件下成正立的像？在什么条件下成倒立的像？由于凸透镜对光的偏折程度与透镜的焦距 f 有关系，因此在描述物距和像 距的数据时，建议用焦距 f 作为参照距离，这样或许更有利于凸显凸透镜成像 的规律。根据你对以上问题的思考，请总结凸透镜成像的规律： 。实验表明：当物距大于 2 倍焦距时，凸透镜成倒 立、缩小的实像；当物距等于 2 倍焦距时，凸透镜成倒 立、等大的实像；当物距小于 2 倍焦距、大于焦距时， 凸透镜成倒立、放大的实像；当物距小于焦距时，凸透 镜成正立、放大的虚像。这就是凸透镜成像的规律。1 请分别说一说照相机、投影仪、放大镜是如何应用凸透镜成像的规律工作的。2 找一个圆柱形的玻璃瓶，里面装入水。把一支笔放在玻璃瓶的一侧，透过玻璃 在照相机中， 凸透镜成倒立、 缩小的实像， 像的位置在哪个范围内？物距与像距相比，哪个比较大？在投影仪中，凸透镜成倒立、放大的实像，像的位置在哪个范围内？物距与像距相比，哪个比较大？想想议议 练习与应用"}}, {"id": "PEP8U_PHYSICS_05_03_P125_1", "label": "P125 3_P125_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_03", "chunk_id": "PEP8U_PHYSICS_05_03_P125_1", "page": 125, "text": "第五章 透镜及其应用 125 瓶 ，可以看到这支笔 （图 5.3-3） 。如果 把笔由靠近玻璃瓶的位置向远处慢慢地移 动，你会看到什么现象？实际做一做，验 证你的猜想。3 某同学用放大镜观赏邮票。如果想让像 变得更大一些，他应该怎样做？4 某同学利用如图 5.3-2 所示的器材做实验。他先用焦距为 20 cm 的透镜甲进行实 验，在光屏上得到了缩小的实像。接下来他想改用焦距为 10 cm 的透镜乙继续实 验。如果不改变发光体和光屏的位置，还想在光屏上得到缩小的实像，透镜乙 应该放在透镜甲的左侧还是右侧？5 实验小组的同学通过实验探究凸透镜成像的规律。实验器材有：一个凸透镜、 光屏、高度为 3.0 cm 的光源和刻度尺。实验时，物距从 4.0 cm 开始，每次增加 2.0 cm。下表是他们记录的物距、像距、像的高度和正倒情况。物距/cm 4.0 6.0 8.0 10.0 12.0 14.0 16.0 18.0 20.0 22.0 24.0 26.0 28.0 像距/cm \\ \\ \\ \\ 60.4 35.6 26.6 22.3 20.0 18.4 17.3 16.6 15.7 像的高度/cm \\ \\ \\ \\ 15.1 7.6 5.0 3.7 3.0 2.5 2.1 1.9 1.7 像的正倒 正 正 正 \\ 倒 倒 倒 倒 倒 倒 倒 倒 倒  （1）实验中怎样判断实像是放大的还是缩小的？（2）请根据表中数据判断该凸透镜的焦距是多少。"}}, {"id": "PEP8U_PHYSICS_05_03_P125_2", "label": "P125 3_P125_2", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_03", "chunk_id": "PEP8U_PHYSICS_05_03_P125_2", "page": 125, "text": "（3）在这个实验中，要使所成的像为虚像，光源的位置应在哪个范围？6 某同学在做探究凸透镜成像规律的实验时，在光屏上得到了发光物体清晰的像， 但他不小心用手指尖触碰到了凸透镜，这时光屏上会出现怎样的情况？有人认 为，光屏上会有指尖的像；也有人认为，光屏上会出现指尖的影子。你是怎样 认为的？7 在天安门广场某处，某同学想拍摄天安门城楼的全景，但发现在该位置无论如 何调节，都只能从观景框中看到城楼的一部分。请你利用本节课学到的知识， 帮他想想办法。应如何做，才能拍摄到天安门城楼的全景？请说明理由。图5.3-3"}}, {"id": "PEP8U_PHYSICS_05_04_P126_1", "label": "P126 4_P126_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_04", "chunk_id": "PEP8U_PHYSICS_05_04_P126_1", "page": 126, "text": "126 物理 八年级上册 第 4 节 眼睛和眼镜  眼睛 眼球好像一架照相机，晶状体和角膜的共同作用相 当于一个凸透镜，把来自物体的光会聚在视网膜上，形 成物体的像。视网膜上的感光细胞受到光的刺激产生信 号，视神经把这个信号传输给大脑，我们就看到了物 体。眼睛通过睫状体来改变晶状体的形状：当睫状体放 松时，晶状体比较薄，远处物体射来的光刚好会聚在视 网膜上，眼睛可以看清远处的物体（图 5.4-2 甲） ；当 睫状体收缩时，晶状体变厚，对光的偏折能力变大，近 处物体射来的光会聚在视网膜上，眼睛就可以看清近处 的物体（图 5.4-2 乙 ）。我们每天用眼睛看东西。眼球的结构 如图5.4-1所示。眼睛是怎样成像的？近视 镜和老花镜是怎样帮助人们看清物体的？问 题 图5.4-1 眼球主要的结构 图5.4-2 正常的眼睛调节 甲 看远处的物体 乙 看近处的物体"}}, {"id": "PEP8U_PHYSICS_05_04_P127_1", "label": "P127 4_P127_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_04", "chunk_id": "PEP8U_PHYSICS_05_04_P127_1", "page": 127, "text": "第五章 透镜及其应用 127 依靠眼睛调节所能看清的最远和最近的两个极限点 分别叫作远点和近点。正常眼睛的远点在无限远处，近 点在大约 10 cm 处。正常眼睛观察近处物体时，最清晰 而又不疲劳的距离大约是 25 cm，这个距离叫作明视 距离。近视眼及其矫正 近视眼只能看清近处的物体，看不清远处的物体。形成近视眼的原因是晶状体太厚，折光能力太强，或者 眼球在前后方向上太长，因此来自远处某点的光会聚在 视网膜前，到达视网膜时已经不是一点而是一个模糊的 光斑了（图 5.4-3 甲） 。利用凹透镜能使光发散的特点， 在眼睛前面放一个合适的凹透镜，就能使来自远处物体 的光会聚在视网膜上（图 5.4-3 乙 ）。图5.4-3 近视眼及其矫正 乙 矫正后甲 近视眼成像于视网膜前  远视眼及其矫正 远视眼只能看清远处的物体，看不清近处的物体。形成远视眼的原因是晶状体太薄，折光能力太弱，或者 眼球在前后方向上太短，因此来自近处某点的光还没有 会聚成一点就到达视网膜了，在视网膜上形成一个模糊"}}, {"id": "PEP8U_PHYSICS_05_04_P128_1", "label": "P128 4_P128_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_04", "chunk_id": "PEP8U_PHYSICS_05_04_P128_1", "page": 128, "text": "128 物理 八年级上册 眼镜的度数 透镜焦距 f 的长短标志着折光本领的大小。焦距越短，折光本领越大。通常把 透镜焦距的倒数叫作透镜焦度，用Φ 表示，即 Φ = 1 f 如果某透镜的焦距是 0.5 m，它的焦度就是 Φ = 1 0.5 m = 2 m -1 如果远视很严重，眼镜上凸透镜的折光本领应该大一些，透镜焦度就要大一 些。平时说的眼镜片的度数，就是镜片的透镜焦度乘 100 的值。例如，100 度远视 镜片的透镜焦度是 1 m -1 ，它的焦距是 1 m。凸透镜（远视镜片）的度数是正数，凹透镜（近视镜片）的度数是负数。请回答以下问题： 1. 看书上的字，测出你的近点，和其他同学的近点比较一下。正常眼、近视 眼、远视眼的近点相同吗？有什么规律？2. +300 度和 -200 度的眼镜片，哪个是远视镜片？它的焦度是多少？焦距是 多少？3. 取一副老花眼镜，测定它的两个镜片的度数。科学世界 的光斑（图5.4-4甲） 。凸透镜能使光会聚，在眼睛前面 放一个合适的凸透镜，就能使来自近处物体的光会聚在 视网膜上（图5.4-4乙 ）。通常人们上了年纪以后，睫状体对晶状体的调节能 力减弱，太近、太远的物体都看不清楚。图5.4-4 远视眼及其矫正 甲 远视眼成像于视网膜后 乙 矫正后"}}, {"id": "PEP8U_PHYSICS_05_04_P129_1", "label": "P129 4_P129_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_04", "chunk_id": "PEP8U_PHYSICS_05_04_P129_1", "page": 129, "text": "第五章 透镜及其应用 129 1 晶状体和角膜的共同作用相当于一个凸透镜。当我们 看远处或近处的物体时，这个凸透镜的焦距有什么不 同？图 5.4-5 模拟的是近视眼还是远视眼看远处物体 的成像情况？应该用什么透镜矫正？配镜矫正时，应 看远处的物体还是近处的物体？2 某同学想进一步了解远视眼矫正的原理，于是利用探究凸透镜成像规律的装置 （图 5.3-2）进行实验。他将凸透镜和光屏的位置固定，移动发光物体，在光屏上得到了清晰的像。（1）如果要模拟远视眼看不清近处物体的情况，他应该怎样移动光屏？（2）如果要模拟远视眼的矫正，他在移动光屏后，保持发光物体、凸透镜和光 屏的位置不变，那么在发光物体和凸透镜之间放置一个什么透镜才能使光 屏上再次出现清晰的像？3 细心的小明观察到爷爷看报纸时会戴着眼镜，而看电视时又会摘下眼镜。因此， 小明判断爷爷戴的是老花镜。请你说说小明是怎样判断的。4 6 月 6 日是全国爱眼日。根据你的观察和了解，生活中有哪些不当的用眼习惯会 导致近视？提出两条预防近视的措施。图5.4-5 练习与应用"}}, {"id": "PEP8U_PHYSICS_05_05_P130_1", "label": "P130 5_P130_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P130_1", "page": 130, "text": "130 物理 八年级上册 第 5 节 跨学科实践：制作望远镜  项目提出 科学家利用巨大的天文望远镜接收来自遥远星系的 信息。通过分析这些信息，人们对宇宙了解得越来越深 入了。根据透镜成像的知识，你也可以自己制作一个如 图5.5-1所示的望远镜。或许你能用它获得新的发现呢！项目分析 要自己制作望远镜，你需要完成以下任务。1. 了解望远镜的基本原理。2. 设计一个望远镜，能够用它观察校园内远处的 物体。3. 根据你的设计方案，选用合适的器材，制作一 个望远镜并进行调试。项目实施 1. 了解望远镜的基本原理 望远镜有不同的类型，其中有一 种望远镜是由两组凸透镜组成的。靠 近眼睛的叫作目镜，靠近被观测物体 的叫作物镜（图 5.5-2） 。物镜的作用 图5.5-1 自制的望远镜 图5.5-2 天文爱好者用的望远镜  ᪫  ᪫"}}, {"id": "PEP8U_PHYSICS_05_05_P131_1", "label": "P131 5_P131_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P131_1", "page": 131, "text": "第五章 透镜及其应用 131 图5.5-3 视角 是使远处的物体在焦点附近成实像，目镜的作用相当于 一个放大镜，用来把这个像放大。细心的同学可能会有疑问：物体距离物镜很远，它 的像却离物镜很近，根据前面探究的结果，这样所成的 像是缩小的，为什么使用望远镜观察物体时会感到物体 被放大了呢？原来，我们能不能看清一个物体，它对我们的眼睛 所成“视角” （图5.5-3）的大小十分重要。视角的大小 不仅和物体本身的大小有关，还和物体到眼睛的距离有 关。望远镜的物镜所成的像虽然比原来的物体小，但它 离我们的眼睛很近，再加上目镜的放大作用，视角就可 以变得很大。进一步的分析表明，像图5.5-2这样的望远镜的放大 倍率为物镜的焦距与目镜的焦距之比。2. 设计简易望远镜 （1）确定望远镜的放大倍率 自制的望远镜可以采用单片的凸透镜作为目镜和物 镜。为了让成像质量好一些，其放大倍率不宜过大，取 放大倍率为 2~3 倍即可。（2）选择物镜和目镜 望远镜的物镜和目镜可以选择老人阅读用放大镜的 镜片，也可以使用老花镜的镜片，还可以直接购买凸透 镜。利用本章所学知识测量凸透镜的焦距，并根据放大 倍率的要求，选择适当焦距的凸透镜分别作为物镜和  目镜。在选择两块凸透镜时，除了需要满足焦距的要求， 物镜的直径还要比目镜的直径大一些。测量凸透镜的直 径，以便制作直径合适的镜筒。由此，应选择焦距较长、直径较大的凸透镜作为物"}}, {"id": "PEP8U_PHYSICS_05_05_P132_1", "label": "P132 5_P132_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P132_1", "page": 132, "text": "132 物理 八年级上册 图5.5-5 选用的凸透镜 镜，焦距较短、直径较小的凸透镜作为目镜。（3）设计镜筒 在用望远镜对不同远近的物体进行观察时，需要调 节两块凸透镜间的距离。如图 5.5-4 所示，镜筒可以设 计成两段，让物镜的镜筒较目镜的镜筒粗一些，这样套 在一起，便于在使用时调节。观察最远处的物体时，两 块凸透镜间的距离约等于两块凸透镜的焦距之和；观察 较近处的物体时，两块凸透镜间的距离要稍大一些。3. 制作及调试望远镜 （1）制作 根据所选凸透镜的焦距和直径制作镜筒。例如，可 以选用如图 5.5-5 所示的两块凸透镜。其中，物镜的焦 距约为 20 cm，直径约为 5 cm ；目镜的焦距约为10 cm， 直径约为 4 cm。想一想：对于图 5.5-4 的制作方案，你 有没有办法减小望远镜两个镜筒间的缝隙？另外，还应 注意每段镜筒的长度需合适，以便留出前后调节的 空间。制作时，根据凸透镜的焦距、直径等数据，以及对 镜筒长度的要求，我们可以利用现成的圆筒状物品（如 装羽毛球的筒） ，也可以通过截取适当尺寸的长方形纸 板（如瓦楞纸板或其他材料） ，并把它卷起来制成镜筒 （图 5.5-6）。图5.5-4 自制望远镜的结构  物镜 目镜"}}, {"id": "PEP8U_PHYSICS_05_05_P133_1", "label": "P133 5_P133_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P133_1", "page": 133, "text": "第五章 透镜及其应用 133 图5.5-6 利用瓦楞纸板制作镜筒 此外，还要考虑如何把物镜和目镜方便地固定在镜 筒上。（2）试用与调整 把目镜镜筒插入物镜镜筒内，把目镜放到眼前，通 过望远镜观察远处的物体。在观察时要通过对镜筒长度 的调节，改变物镜与目镜间的距离，直到在望远镜中看 到远处物体清晰的像为止。展示交流 向其他同学展示你的成果，介绍你的制作方案，分 享你的收获。例如，在制作望远镜的过程中，你发现了 哪些问题？你是如何改进的？还要倾听其他同学的讲 解，看看对你有什么启发。同学之间相互评价，比一比 谁的望远镜更完善。"}}, {"id": "PEP8U_PHYSICS_05_05_P134_1", "label": "P134 5_P134_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P134_1", "page": 134, "text": "134 物理 八年级上册 望远镜与宇宙探索 在人类历史的早期，人们利用肉眼观测天象。后来人们通过测量天体的运动、 制定历法，指导人们的生产生活。例如，战国时期的文献中记载： “斗柄东指，天 下皆春；斗柄南指，天下皆夏；斗柄西指，天下皆秋；斗柄北指，天下皆冬。”这 说明人们很早就发现了北斗七星一年中的周回运转在昭示四季、节气变迁方面的 重要作用。望远镜的发明大大扩展了人类观测天空的视野。第一位把望远镜指向天空的是意大利物理学家伽利 略。1609 年，伽利略用自制的望远镜观察天体（图 5.5-7） ，以确凿的证据支持了哥白尼的“日心说” 。他还第一个观察到了木星的卫星、太阳黑子和月球 上的环形山。1846 年，科学家根据牛顿发现的万有引力定律， 猜想天王星外还存在一颗未知的行星，并计算出这 颗行星的运动轨道。不久，人们用望远镜在预测的 位置发现了这颗行星，它被命名为“海王星” 。这一 发现为万有引力定律提供了有力的支持。1990 年，科学家把哈勃空间望远镜送入太空，使人类观测宇宙的能力空前提 高。除光学天文望远镜外，人们还发明了其他观测太空的仪器，如射电天文望远 镜，这使人类对宇宙的了解越来越深入。我国不仅古代在天文 观测上取得了丰硕的成果， 在现代也对宇宙探索作出 了很大贡献 。2009 年， 郭 守敬望远镜建成 ，并于 2011年启动光谱巡天任务， 成为世界上第一个获取光 谱数突破千万量级的望远 镜（图5.5-8）。"}}, {"id": "PEP8U_PHYSICS_05_05_P134_2", "label": "P134 5_P134_2", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P134_2", "page": 134, "text": "2020年，中 国天眼正式开放运行，它 是目前全球单口径最大 、 科学世界 图5.5-7 伽利略时代的望远镜 图5.5-8 郭守敬望远镜"}}, {"id": "PEP8U_PHYSICS_05_05_P135_1", "label": "P135 5_P135_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "chunk_id": "PEP8U_PHYSICS_05_05_P135_1", "page": 135, "text": "第五章 透镜及其应用 135 太阳系 银河系 地球和月球 灵敏度最高的射电天文望远镜。通过对宇宙的不懈探索，我们现在知道，宇宙中拥有上千亿个星系，银河系 只是这上千亿个星系中的一个。银河系异常巨大，一束光穿越银河系需要约 10 万 年的时间。太阳不过是银河系中几千亿颗恒星中的一员（图 5.5-9） 。太阳周围有 水星、金星、地球、火星、木星、土星、天王星、海王星等行星绕它运行，地球 在离太阳比较近的第三条轨道上。此外，还有若干其他天体绕太阳转动。随着技术的进步，更多的大型望远镜和空间望远镜将提供更高的分辨率和更 广的观测范围，继续挑战和超越我们对宇宙的现有认识，帮助我们揭示更多宇 宙的奥秘。图5.5-9 巨大的银河系"}}, {"id": "PEP8U_PHYSICS_06_01_P139_1", "label": "P139 1_P139_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "chunk_id": "PEP8U_PHYSICS_06_01_P139_1", "page": 139, "text": "第六章 质量与密度 139 第 1 节 质量 生活中人们常常会关心物质有多少以及如何衡量 物质的多少等问题，下面我们就来学习相关内容。质量 一把铁锤比一枚铁钉所含的物质多，一杯水比一 桶水所含的物质少 。物体所含 物质的多少叫作 质量 （mass） ，通常用字母m 表示。质量的基本单位是 千克，符号是 kg。常用的比千 克小的单位有克（ g） 、毫克（mg） ，比千克大的单位 有吨（t） 。它们之间的关系是  1 g = 10 -3  kg  1 mg = 10 -3  g = 10 -6  kg  1 t = 10 3  kg 从日月星辰、山河湖海，到我们周围的所有物 体，包括我们自己，都是由物质组成的。人们很早 就用天平测量物质的多少了（图 6.1-1） 。现在人 们又是怎样表示和测量物质的多少呢？比如多少 粮食、多少菜。问 题 图6.1-1 战国时期的天平"}}, {"id": "PEP8U_PHYSICS_06_01_P140_1", "label": "P140 1_P140_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "chunk_id": "PEP8U_PHYSICS_06_01_P140_1", "page": 140, "text": "140 物理 八年级上册 表6.1-1 一些物体的质量 物体 质量/ kg 物体 质量/ kg 大头针 约8.0 ×10 -5 蓝鲸 可达1.8×10 5 A4打印纸 约4×10 -3 超大的集装箱船 可达2.3×10 8 鸡蛋 约5×10 -2 地球 约6.0×10 24 排球 约2.6×10 -1 太阳 约2.0×10 30  质量的测量工具 我们到市场买蔬菜、水果或粮食，售货员通常要用 秤来称量货物的质量（图 6.1-3）。小资料 在下面这几种情况中，物体的质 量是否发生了变化？1. 钢锭被轧成钢板。2. 冰块熔化成水。3. 把“冰墩墩”从地面带到空 间站（图 6.1-2）。想想议议 钢锭被轧成钢板，虽然形状变了，但是所含钢的多 少并没有变，因此质量也不会变；一块冰熔化成水，虽 然物态变了，但是质量不变；“冰墩墩”无论是在地面 上还是被带上空间站，它的质量都不会改变。物体的 质量不随它的形状、物态和位置而改变。图6.1-2 “冰墩墩”在空间站"}}, {"id": "PEP8U_PHYSICS_06_01_P141_1", "label": "P141 1_P141_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "chunk_id": "PEP8U_PHYSICS_06_01_P141_1", "page": 141, "text": "第六章 质量与密度 141 在学校的实验室常用天平称质量。下面，我们将一 边学习，一边操作，练习使用托盘天平。托盘天平的使用 为了不使天平损坏，在操作之前要注意下面的几条 要求。1. 每个天平都有自己的“称量” ，也就是它所能称 的最大质量。被测物体的质量不能超过称量。2. 向盘中加减砝码时要用镊子，不能用手接触砝 码，不能把砝码弄湿、 弄脏。3. 潮湿的物体和化学药品不能直接放到天平的 托盘中。请你逐条分析，如果不按这些要求做，会出现什么 问题。图6.1-3 几种秤 甲 台秤 丙 电子秤乙 案秤"}}, {"id": "PEP8U_PHYSICS_06_01_P142_1", "label": "P142 1_P142_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "chunk_id": "PEP8U_PHYSICS_06_01_P142_1", "page": 142, "text": "142 物理 八年级上册 上面所用的天平是一种机械天平，现在也常用电 子天平来测量质量 。有的电子天平精确度很高 ，对  5×10 -11  kg 大小的质量（相当于一个红细胞的质量）都 能反映出来。质量单位——千克的由来 自古以来，各国采用过各种不同的质量单位。例如，我国曾经用斤、两、钱 作为质量单位，英、美等国曾经用磅作为质量单位。现在世界各国普遍采用国际 科学世界 用托盘天平测量物体的质量 观察托盘天平的结构（图6.1-4） ，边思考边练习使用托盘天平测量物体的质量。图6.1-4 托盘天平 1. 把托盘天平放在水平的桌面上。2. 把游码移到标尺左端的零刻度线处，调节横梁上的平衡螺母，使指针 指在分度盘的中线处，这时横梁水平平衡。3. 把被测物体放在左盘中，在右盘中加减砝码，并调节游码在标尺上的 位置，直到横梁恢复水平平衡。这时盘中砝码的总质量加上游码左端在标尺上 所对应的质量，就等于被测物体的质量。用天平称出橡皮、铅笔的质量。如果要用天平称出小瓶中水或粉状物体（例如食盐）的质量，该如何称量？实 验"}}, {"id": "PEP8U_PHYSICS_06_01_P143_1", "label": "P143 1_P143_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "chunk_id": "PEP8U_PHYSICS_06_01_P143_1", "page": 143, "text": "第六章 质量与密度 143 1 当航天员身着航天服在地面上行走时，航天服很沉重；而当航天员在太空出舱 行走时，却让人感觉航天服轻飘飘的。在地球上或在太空中航天服的质量有没 有改变？为什么？2 把一块质量为 100 g 的冰敲成碎冰，碎冰的质量是多少？这些碎冰熔化成水后的 质量又是多少？你判断的依据是什么？3 某同学注意到如图 6.1-4 所示的托盘天平上有两个平衡螺母。如果称量前指针偏 向分度盘右侧，他该怎样调节平衡螺母？4 某同学想用托盘天平测量烧杯中水的质量。他 先测量出烧杯的质量。当天平平衡时，他一共 使用了 3 个砝码 ，其中 1 个 50 g、1 个 20 g 和  1 个 5 g。另外，游码在标尺上的位置如图 6.1-6 所示。烧 杯的质量是多少？后来，他又把水倒入烧杯，测量出烧杯 和水的总质量是 179.2 g。烧杯中水的质量是多少？5 现有一盒规格相同的回形针（图 6.1-7） ，怎样利用天平 测量出一枚回形针的质量？怎样估计出这盒回形针的数 量？写出你的方法。练习与应用 单位制，在国际单位制中质量的基本单位是千克。1791 年，法国在规定了长度的单位米的基础上规 定了质量单位，即规定 4 °C 的 1 dm 3 纯水的质量为 1 kg， 之后用铂制作了标准千克原器。后来，人们又以此为 标准，用铂铱合金制作了国际千克原器（图 6.1-5）。1889 年，第 1 届国际计量大会批准以这个国际千克原器 作为质量的标准。"}}, {"id": "PEP8U_PHYSICS_06_01_P143_2", "label": "P143 1_P143_2", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "chunk_id": "PEP8U_PHYSICS_06_01_P143_2", "page": 143, "text": "这种作为质量测量标准件的具体实物，终会因为外界环境的变化而引起质量 的变化。例如，近年来科学家就发现国际千克原器质量大约减少了 5×10-5  g，相 当于一小粒沙子的质量。2018 年，第 26 届国际计量大会决定更新千克的定义，在 不使用具体实物的情况下定义了质量单位。图6.1-7 图6.1-5 国际千克原器 （复制品） 0 123 4 5 g 图6.1-6"}}, {"id": "PEP8U_PHYSICS_06_02_P144_1", "label": "P144 2_P144_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "chunk_id": "PEP8U_PHYSICS_06_02_P144_1", "page": 144, "text": "144 物理 八年级上册  物质的质量与体积的关系 为了解决上面的问题，我们可以思考一下：如果一 个铝块的体积是另一个铝块的 2 倍、3 倍……那么它的 质量也是另一个的 2 倍、3 倍……吗？也就是说，同种 物质的质量与它的体积成正比吗？长度和横截面积都相同的铝柱 （图 6.2-1）和钢 柱，哪个质量大？如果它们的体积很大，质量不便直 接测量，我们如何间接地得到它们的质量呢？问 题 探究物质的质量与体积的关系 实验思路 要探究物质的质量与体积的关系，我们可以先根据生活中的经验提出猜 想，再选用相同物质组成的不同大小的物体做实验。例如，取大小不同、外形 规则的若干铝块（不同的实验组可选择铁块或木块）做实验。用天平测出不同 铝块的质量，想办法得出不同铝块的体积。根据实验数据，研究铝块的质量与 体积的关系。图6.2-1 铝柱 实 验 第 2 节 密度"}}, {"id": "PEP8U_PHYSICS_06_02_P145_1", "label": "P145 2_P145_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "chunk_id": "PEP8U_PHYSICS_06_02_P145_1", "page": 145, "text": "第六章 质量与密度 145 在上面的探究中，铝块的质量与体积之比不变。铁块或木块的质量与体积之比是否也是不变的？这 个比值跟铝块的一样吗？密度 同种物质的质量与体积之比是一定的 ，物质不 同，这个比值一般也不同。在物理学中， 某种物质组 成的物体的质量与它的体积之比叫作这种物质的密度 （density） 。如果用 ρ 表示密度、m 表示质量、V 表示体 积，那么用公式表示就是 ρ= m V 实验过程  测量被测物体的质量和体积，把实验数据填写到下面设计的表格中。实验结论 以体积V为横坐标，以质量m为纵坐标（图6.2-2） ，在坐标纸上描点，再把 这些点连起来，看看它们是否大致在一条直线上。通过所作的图像，可以直观地 看到铝块的质量与体积的关系。你从中能得出什么结论？与你的猜想一样吗？结论：铝块的质量与体积 。被测物体 m/g V/cm 3 铝块1 铝块2 铝块3 铝块4 …… 图6.2-2 质量与体积的关系图像 V/cm3 m/g"}}, {"id": "PEP8U_PHYSICS_06_02_P146_1", "label": "P146 2_P146_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "chunk_id": "PEP8U_PHYSICS_06_02_P146_1", "page": 146, "text": "146 物理 八年级上册 密度 ρ 的单位是由质量单位和体积单位组成的。在国际单位制中，密度的单位是 千克每立方米 ，符号  是 kg/m 3 。有时候也用克每立方厘米作为密度的单位， 符号是 g/cm 3 。这两个密度单位的关系是 1 g/cm 3  =1×10 3  kg/m 3 物质 密度 /（kg·m -3 ） 物质 密度 /（kg·m -3 ） 水银 13.6×10 3 纯水 1.0×10 3 硫酸 1.8×10 3 酒精 0.8×10 3 海水 1.03×10 3 汽油 0.71×10 3 表6.2-2 一些液体的密度（常温常压） 物质 密度 /（kg·m -3 ） 物质 密度 /（kg·m -3 ） 金 19.3×10 3 铝 2.7×10 3 铅 11.3×10 3 花岗岩 (2.6～2.8)×10 3 银 10.5×10 3 冰（0 ℃） 0.9×10 3 铜 8.9×10 3 蜡 0.9×10 3 铁 7.9×10 3 干松木 0.5×10 3 表6.2-1 一些固体的密度（常温常压） 小资料 物质 密度 /（kg·m -3 ） 物质 密度 /（kg·m -3 ） 二氧化碳 1.98 一氧化碳 1.25 氧气 1.43 氦气 0.18 空气 1.29 氢气 0.09 表6.2-3 一些气体的密度（0 ℃，标准大气压）"}}, {"id": "PEP8U_PHYSICS_06_02_P147_1", "label": "P147 2_P147_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "chunk_id": "PEP8U_PHYSICS_06_02_P147_1", "page": 147, "text": "第六章 质量与密度 147 密度与温度 温度能够改变物质的密度。在常见的物质中，气体的热胀冷缩最显著，它的 密度受温度的影响也最大。一般固体、液体的热胀冷缩不像气体那样明显，因而 它们的密度受温度的影响比较小。在我国的北方，冬天对自来水管的保护十分重要。如果保护不好，水管内的 水结了冰，不仅影响正常的生活用水，有时还会把水管冻裂，造成设备的损坏。水管为什么会被冻裂？从密度表中，我们可以看到冰的密度比水的密度小，因此 水冻成冰后体积增大，这样就把水管胀裂了。一般来说 ，同种物质温度越高密度越 小，遵从热胀冷缩的规律，但是水比较特 殊。水在 4 ℃时密度最大。温度高于 4 ℃时， 随着温度的升高，水的密度越来越小；温度 低于 4 ℃时，随着温度的降低，水的密度也 越来越小。水凝固成冰时体积变大，密度变 小。图 6.2-3 为冬天湖水温度分布示意图 。在寒冷的冬天，湖面封冻了，较深湖底的水 却有可能保持 4 ℃的水温，鱼儿仍然可以自 由自在地游动呢！科学世界 图6.2-3 冬天湖水温度分布示意图 0 C 1 C 2 C 3 C 4 C 例 题 已知铝棒的直径 d 为 0.1 m，长 l 为 2.5 m，铝棒的质量是多少？解 铝棒的体积 V=π d 2 2  l=3.14× 0.1 m 2 2 ×2.5 m=0.02 m 3 根据公式ρ= m V ，有  m铝 = ρ 铝 V=2.7×10 3  kg/m 3 ×0.02 m 3 =54 kg 铝棒的质量是 54 kg。"}}, {"id": "PEP8U_PHYSICS_06_02_P148_1", "label": "P148 2_P148_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "chunk_id": "PEP8U_PHYSICS_06_02_P148_1", "page": 148, "text": "148 物理 八年级上册 1 某小组在探究某物质的质量与体积的关系时，得到了如下表所示的实验数据。请你根据实验数据在图 6.2-4 中作出图像。由图像你能得出什么结论？2 金属锇是迄今人们发现的地球上密度最大的金属 。225.9 g 金属锇的体积为  10 cm 3 ，它的密度是多少？中子星的密度可达 2×10 18  kg/m 3 ，中子星的密度约为 金属锇的多少倍？3 一个澡盆大致是长方体，其长、宽、高分别约为1.2 m、0.5 m、0.3 m。它最多能 装多少千克的水？4 猜一猜你们教室里空气的质量有多少。几克？几十克？还是几千克、几十千 克？测出你们教室的长、宽、高，算一算里面空气的质量。你猜得对吗？5 人体的密度跟水的密度差不多，根据你的质量估算一下自己身体的体积。6 把一大块冰制成一个冰雕作品，冰块的密度会不会发生变化？说说你的理由。7 在学习了公式 后，某同学认为根据公式可以推出“物体的质量越大，密 度越大；物体的体积越大，密度越小”的结论。你认为这种推论正确吗？说说 你的理由。练习与应用 图6.2-4 10 5 10 15 20 25 30 35 20 30 40 50 60 70 V /cm3 m/g 0 序号 1 2 3 4 5 6 体积V/cm 3 10 15 25 35 45 60 质量m/g 4.9 7.4 12.6 17.4 22.6 30.1 ρ = m V"}}, {"id": "PEP8U_PHYSICS_06_03_P149_1", "label": "P149 3_P149_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "chunk_id": "PEP8U_PHYSICS_06_03_P149_1", "page": 149, "text": "第六章 质量与密度 149 良种是增产的重要因素之一。农民选种有多种方 式。例如，为了选出饱满的种粒，可以配制适当密度的 盐水进行选种。将种粒浸没在盐水中并适当搅拌，静置 一段时间后，清除水面漂浮的空粒、瘪粒，就可以选出 较好的种子（图 6.3-1） 。怎样测量盐水的密度呢？问 题 测量盐水的密度 实验思路 首先测出盐水的质量和体积，然后通过公式 就能计算出盐水的密度。对于液体，我们可以用量筒直接测量它的体积 。这需要我们先了解一下量筒的使用方法。1. 观察你所用的量筒是以什么单位标度的，量筒的 最大测量值是多少，量筒的分度值是多少。2. 如图 6.3-2 所示，读数时，视线要与液面相平。实验过程 一杯水因溶入不同质量的盐而密度不同。自己用盐和 水配制一杯盐水，利用天平测量盐水的质量，利用量筒测 量盐水的体积。将测量数据及计算结果记录在下表中。ρ=m V 杯和盐水的 质量 m1/g 杯和剩余盐水的 质量 m2/g 量筒中盐水的质量 m（=m1-m2）/g  量筒中盐水的 体积 V/ cm 3 盐水的密度 ρ/（g·cm -3 ） 实 验 图6.3-2 量筒的读数方法 20 C 100 mL 20 30 40 50 60 70 80 90 100 10 第 3 节 测量液体和固体的密度 图6.3-1 空粒、瘪粒漂浮在盐 水表面"}}, {"id": "PEP8U_PHYSICS_06_03_P150_1", "label": "P150 3_P150_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "chunk_id": "PEP8U_PHYSICS_06_03_P150_1", "page": 150, "text": "150 物理 八年级上册 以上是对液体密度的测量。想一想：对于形状不规 则的固体，又该如何测量它的密度呢 ?  测量小石块的密度 实验思路 小石块是形状不规则的固体，怎样测出它的体积 呢？图 6.3-3 给出了一种用量筒测量固体体积的方法。请 你描述这种方法，并与同学交流。测出不吸水的小石块的体积和质量，就可以利用公 式 得到小石块的密度了。实验过程 1. 用天平测量小石块的质量，并将数据记录在自己 设计的表格中。2. 用量筒测量小石块的体积，并记录数据。3. 根据公式 求出小石块的密度。实 验 图6.3-3 用量筒测量形 状不规则固体的体积  ˳ V2 V1 20 C 100 mL 20 30 40 50 60 70 80 90 100 10 20 C 100 mL 20 30 40 50 60 70 80 90 100 10 ρ = m V 细微差别中的重大发现 19 世纪末，英国物理学家瑞利在精确测量各种气体的密度时，发现从空气中 取得的氮的密度是 1.257 2 kg/m 3 ，而从氨中取得的氮的密度却是 1.250 5 kg/m 3 。虽 经多次重复测量，但仍然存在这个令人奇怪的差异。后来，他与化学家拉姆塞合作，于 1894 年在从空气中取得的氮里，分离出另 一种当时还不知道的气体——氩，这个谜才解开了。原来，氩的密度较大，空气 中的氮混有少量氩，它的密度就比从氨中取得的纯氮的密度稍大一点儿。这是科学史上一个很有名的故事，它说明在科学实验中，精确的测量是多么 重要。"}}, {"id": "PEP8U_PHYSICS_06_03_P150_2", "label": "P150 3_P150_2", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "chunk_id": "PEP8U_PHYSICS_06_03_P150_2", "page": 150, "text": "正是由于瑞利不放过这一细微差异而执着地研究下去，氩才得以被发现。瑞利因此荣获 1904 年的诺贝尔物理学奖。科学世界 ρ = m V"}}, {"id": "PEP8U_PHYSICS_06_03_P151_1", "label": "P151 3_P151_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "chunk_id": "PEP8U_PHYSICS_06_03_P151_1", "page": 151, "text": "第六章 质量与密度 151 1 使用量筒测量液体的体积，读数时会出现如图 6.3-4 所 示的三种情况，其中正确的是哪一种？在测量体积约为  80 mL 的液体时，我们应该选择规格是“100 mL 1 mL”的 还是“500 mL 5 mL”的量筒？为什么？2 一个容积为 2.5 L 的塑料瓶，用它装水，最多装多少千 克？用它装植物油呢？取植物油的密度为 0.9×10 3  kg/m 3 。（1 L = 1 dm 3 ） 3 有一个表面光滑、浑然一体的铜制工艺品，它的质量为 89 g，体积为 20 cm 3 。请 你通过计算判断这个工艺品是不是中空的。4 为确定某种金属块的密度，首先用天平测量金属块的质量。当天平平衡时，放 在右盘中的砝码和游码的位置如图 6.3-5 甲所示，则金属块的质量 m 是多少？然 后用量筒测量金属块的体积。将水倒入量筒，液面达到的位置如图 6.3-5 乙所 示，再把金属块完全浸没在量筒的水中，水面升高，如图 6.3-5 丙所示，则该金 属块的体积V是多少？根据测量结果可知该金属块的密度是多少？图6.3-5 甲 乙 丙 0 123 4 5 g 5 g 10 g 20 g 20 30 ˳ 10 20 30 40 50  20 C 50 mL 30 20 10 20 30 40 50  20 C 50 mL 5 某同学想测量盒装牛奶的密度。他把一盒牛奶放在天平上，测出总质量为270.0 g ；"}}, {"id": "PEP8U_PHYSICS_06_03_P151_2", "label": "P151 3_P151_2", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "chunk_id": "PEP8U_PHYSICS_06_03_P151_2", "page": 151, "text": "把牛奶倒入量筒 30 mL 后，测得剩余部分的质量为 238.5 g。这种盒装牛奶的密度 是多少？练习与应用 图6.3-4 甲 乙 丙 20 C 100 mL 20 30 40 50 60 70 80 90 100 10"}}, {"id": "PEP8U_PHYSICS_06_04_P152_1", "label": "P152 4_P152_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "chunk_id": "PEP8U_PHYSICS_06_04_P152_1", "page": 152, "text": "152 物理 八年级上册 第 4 节 密度的应用  利用密度求出质量 根据公式 ，可以推导出 m= ρV。物体的质量 等于它的密度与体积的乘积。因此，知道了物体的体 积，查出组成物质的密度，就可以算出物体的质量。对 于不易直接称量质量的庞大物体，这种办法很方便。节前“问题”栏目中已经给出巨石的长 l1、宽 l2、 厚 l3，巨石的体积就可以计算出来，即  V = l1l2l3  = 14.7 m×2.9 m×1.0 m   = 42.6 m 3 查表，取花岗岩的密度 ρ=2.8×10 3  kg/m 3 ，把数据 代入公式，就可以得到巨石的质量  m = ρV  = 2.8×10 3  kg/m 3 ×42.6 m 3 ρ=m V 图6.4-1 人民英雄纪念碑 矗立在天安门广场的人民英雄纪念碑（图 6.4-1） ，碑身高37.94 m，由 413 块花岗岩石块 砌成。碑心石由一整块花岗岩经多次加工而成， 当这块花岗岩被加工成长 14.7 m、宽 2.9 m、厚 1.0 m 的长方体巨石时，它的质量约为多少？问 题"}}, {"id": "PEP8U_PHYSICS_06_04_P153_1", "label": "P153 4_P153_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "chunk_id": "PEP8U_PHYSICS_06_04_P153_1", "page": 153, "text": "第六章 质量与密度 153  = 119.3×10 3  kg   = 119.3 t  利用密度求出体积 根据公式 ，可以推导出 。利用这个公 式，知道了物体的质量，查出组成物质的密度，就可以 算出物体的体积。对于形状不规则或不便于直接测量体 积的物体，这是一种很方便的求体积的办法。修缮某文物需要使用厚度为 0.15 μm 的金箔，这种 金箔主要由黄金制成（图 6.4-2） 。假设没有损耗，那 么 10 g 的黄金能修缮多大面积 ?  查表，把金的密度ρ=19.3×10 3  kg/m 3 代入公式，可 以得到 10 g 黄金的体积 V= m ρ = 10×10 -3  kg 19.3×10 3  kg/m 3 =5.2×10 -7  m 3 由于所用金箔的厚度 d=0.15 μm，则能修缮的面积 S= V d = 5.2×10 -7  m 3 0.15×10 -6  m =3.5 m 2  利用密度鉴别物质 如果测出由某种物质组成的物体的密度，再把测得 的密度跟密度表中各种物质的密度比较一下，就可以知 道该物体可能是由什么物质构成的了。体育锻炼用的一个实心“铅球”的质量是 4 kg，经 测量知道它的体积是 0.57 dm 3 。这个球是用纯铅制造 的吗？要想知道制造铅球的材料是否为纯铅，可以先求出 ρ=m V V=m ρ 图6.4-2 金箔"}}, {"id": "PEP8U_PHYSICS_06_04_P154_1", "label": "P154 4_P154_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "chunk_id": "PEP8U_PHYSICS_06_04_P154_1", "page": 154, "text": "154 物理 八年级上册 它的密度，再与纯铅的密度进行比较。此铅球的密度  ρ = m V  = 4 kg 0.57×10 -3  m 3  =7.0×10 3  kg/m 3 查表可知铅的密度是 11.3×10 3  kg/m 3 ，可见这个铅 球不是纯铅制成的。银饰品深受人们喜爱（图 6.4-3） ，但是银饰品不 一定都用纯银制成。有些银饰品的成分除银之外 , 还可 能有铜、镍等。通过测量密度可以对其是否为纯银作出 初步判断。不同物质的密度可能是相同的。例如，酒精和煤油 都是液体，它们的密度都是 0.8×10 3  kg/m 3 ，但是通过 气味可以区分它们。因此，要准确地鉴别物质，常常需 要多种方法并用。密度是物质的基本性质之一，每种物质都有自己的 密度。密度在我们的社会生活中还有其他重要的应用。例如，通过对样品密度等信息的采集，可以确定它的种 类及经济价值。鉴定牛奶、酒的品质，都要用到密度的 知识。很多材料的选择需要考虑物质的密度。例如，拍 摄电影时的石头道具使用密度很小的泡沫塑料制成；机床底座则需要用坚固、密度大的材料制成；飞机的 外壳常采用高强度、低密度的合金或新型合成材料制 成；超过百米的海上风力发电机的叶片采用了具有密度 小、强度高、耐腐蚀、抗疲劳等优异性能的碳纤维材料  （图 6.4-4）。图6.4-3 银饰品 图6.4-4 风力发电机的叶片"}}, {"id": "PEP8U_PHYSICS_06_04_P155_1", "label": "P155 4_P155_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "chunk_id": "PEP8U_PHYSICS_06_04_P155_1", "page": 155, "text": "第六章 质量与密度 155 材料与社会发展 我们周围的生活用品是由各种材料制成的：金 属、陶瓷、玻璃、塑料，等等。一般来说，不同的 材料具有不同的物理性质。除密度不同外，材料的 导电性、磁性、弹性、硬度、延展性等也往往各不 相同。在生产生活中，人们利用各种材料的特性， 设计出所需的物品。某一种新材料的问世及其应用，往往会引起人 类社会的重大变革。在旧石器时代，人类通过简单加工获得石器， 用来狩猎，维持生存。随着石器加工制作水平的提 高，人类社会进入了新石器时代，出现了原始手工 业，如制陶和纺织。青铜器（图 6.4-5）的出现大大 促进了农业和手工业的发展。青铜是由铜、锡等元 素组成的合金，它的熔点低、硬度高、耐用性强。我国是世界上冶铁业出现较早的国家之一。春 秋战国时代，由铁制作的农具、手工工具及各种兵 器得以广泛应用。铁器时代的到来，大大促进了社 会的发展。随着钢铁、水泥等材料的出现和广泛应 用，人类社会从农业和手工业社会进入了工业社会。随着我国工业技术的发展，目前，我国自主研发的 “手撕钢”比纸还要薄（图 6.4-6） ，被不断应用到许 多高新技术领域。20 世纪，各种新材料层出不穷。例如，气凝胶 （图 6.4-7）是当今世界上密度最小的固体。这种新 材料具有隔热、耐高温等性能，在新能源汽车、航 空航天等领域有多种用途。而半导体等新材料的出 现和广泛应用，则把人类社会由工业社会推向信息 社会。基于材料对社会发展的作用，人们将信息、 能源和材料并列为现代文明的三大支柱。"}}, {"id": "PEP8U_PHYSICS_06_04_P155_2", "label": "P155 4_P155_2", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "chunk_id": "PEP8U_PHYSICS_06_04_P155_2", "page": 155, "text": "在这三大 支柱中，材料又是能源和信息的基础。科学 技术 社会 环境 图6.4-5 商代后期用于 蒸煮的青铜器——甗 图6.4-6 “百炼钢做成了绕指柔” 图6.4-7 气凝胶"}}, {"id": "PEP8U_PHYSICS_06_04_P156_1", "label": "P156 4_P156_1", "group": "text_chunk", "degree": 1, "size": 6, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "chunk_id": "PEP8U_PHYSICS_06_04_P156_1", "page": 156, "text": "156 物理 八年级上册 1 建筑工地需用沙子 400 m 3 ，若用载质量为 4 t 的卡车运送，需运多少车？取沙子 的密度为 1.6×10 3  kg/m 3 。2 一捆铜线的质量为 89 kg，铜线的横截面积是 25 mm 2 。这捆铜线的长度是多少？3 用天平和尺能不能得出一块长方形铝箔的厚度？如果能，写出你的办法。4 生活中铝箔的应用非常广泛。下表给出的是厨房中使用的某厚质铝箔的长度、 宽度和厚度等相关信息。假设铝箔由纯铝制作，请你根据表中的数据，判断 它的质量是否与标称的相同。5 我国唐代的“黄河铁牛”是世界桥梁史上的瑰宝，巨 大的铁牛（图 6.4-8）起到固定索桥的作用。若最大的 一尊铁牛的质量为 72 t，要用密度为 1.35×10 3  kg/m 3 的 石膏制作一个体积是铁牛万分之一的模型，需用石膏的质 量约为多少？假设铁牛的密度为7.9×10 3  kg/m 3 。品名 食品用 厚质铝箔 规格 30 cm × 20 m 质量162 g 使用原料 铝箔10 μm × 300 mm 练习与应用 图 6.4-8"}}, {"id": "EV_PEP8U_PHYSICS_01_01_01", "label": "在古代，人们用圭表、日晷", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_01_01", "paragraph_id": "EV_PEP8U_PHYSICS_01_01_01", "source_page": 14, "evidence_type": "科学史与文化", "keyword": "在古代，人们用圭表、日晷", "textbook_original_excerpt": "时间单位还有小时（h）、 分 （min）等，它们 之间的关系是 1 h = 60 min  1 min = 60 s 在古代，人们用圭表、日晷（图 1.1-6） 、沙漏等计 时仪器来测量时间。你还知道有哪些测量时间的方法？", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_01_01_02", "label": "国际单位制（SI）", "group": "ideology_evidence", "degree": 4, "size": 9, "data": {"section_id": "SEC_PEP8U_PHYSICS_01_01", "paragraph_id": "EV_PEP8U_PHYSICS_01_01_02", "source_page": 16, "evidence_type": "规范与标准", "keyword": "国际单位制（SI）", "textbook_original_excerpt": "鉴于这种认识，国际计量组织制定了一套国际统一的单位，称之为 国际单位制（SI） ，推荐各国使用。目前世界上大多数国家和地区已经采用国际单 位制，我国的法定计量单位也是以国际单位制为基础制定的", "ideology_l3_codes": "T08-01-03;T02-02-01;T06-02-01", "ideology_l3_labels": "国际标准认知;公共责任;证据推理"}}, {"id": "EV_PEP8U_PHYSICS_01_02_01", "label": "中国空间站的梦天实验舱", "group": "ideology_evidence", "degree": 4, "size": 9, "data": {"section_id": "SEC_PEP8U_PHYSICS_01_02", "paragraph_id": "EV_PEP8U_PHYSICS_01_02_01", "source_page": 19, "evidence_type": "工程与科技应用", "keyword": "中国空间站的梦天实验舱", "textbook_original_excerpt": "3 中国空间站的梦天实验舱与天和核心舱 成功对接，转位后形成空间站“ T”字 基本构型。在梦天实验舱靠近天和核心 舱的过程中（图 1.2-5） ，以天和核心舱 为参照物，梦天实验舱是运动的还是静 止的？", "ideology_l3_codes": "T02-03-02;T02-01-01;T06-04-01", "ideology_l3_labels": "科技报国;国家认同;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_01_03_01", "label": "我国优秀短跑运动员", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_01_03", "paragraph_id": "EV_PEP8U_PHYSICS_01_03_01", "source_page": 23, "evidence_type": "社会生活与责任", "keyword": "我国优秀短跑运动员", "textbook_original_excerpt": "我国优秀短跑运动员以 9.83 s的成绩打破了亚洲纪录。他在这次比赛中的平均速度是多少？", "ideology_l3_codes": "T06-02-01", "ideology_l3_labels": "证据推理"}}, {"id": "EV_PEP8U_PHYSICS_01_04_01", "label": "公路上有许多速度监测设备", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_01_04", "paragraph_id": "EV_PEP8U_PHYSICS_01_04_01", "source_page": 25, "evidence_type": "社会生活与责任", "keyword": "公路上有许多速度监测设备", "textbook_original_excerpt": "公路上有许多速度监测设备，其中一种测速设备采用的是区间测速的方法（图 1.4-1），即通过测算车辆在两个监测点之间的平均速度，判断车辆在该路段是否超速。这种测速设备是如何测算出车辆的平均速度的？", "ideology_l3_codes": "T02-03-03;T02-02-01", "ideology_l3_labels": "国防与国家安全意识;公共责任"}}, {"id": "EV_PEP8U_PHYSICS_01_04_02", "label": "汽车倒车防撞、智能机器人", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_01_04", "paragraph_id": "EV_PEP8U_PHYSICS_01_04_02", "source_page": 27, "evidence_type": "工程与科技应用", "keyword": "汽车倒车防撞、智能机器人", "textbook_original_excerpt": "超声波在空气中的传播速度约为 340 m/s，它具有指向性好、反射能力强、能 量集中等特点，因而经常被用于距离的测量、汽车倒车防撞、智能机器人等领域。 超声波测距的原理如图 1.4-4 所示", "ideology_l3_codes": "T06-04-01", "ideology_l3_labels": "工程设计"}}, {"id": "EV_PEP8U_PHYSICS_02_01_01", "label": "骨传导不用空气传声", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_01", "paragraph_id": "EV_PEP8U_PHYSICS_02_01_01", "source_page": 36, "evidence_type": "社会生活与责任", "keyword": "骨传导不用空气传声", "textbook_original_excerpt": "骨传导不用空 气传声，可以有效避免嘈杂环境的干扰，常应用在 工业、战场等特殊场合中。而利用骨传导原理制成的助听器、耳机等更是在生活 中得到了广泛的应用", "ideology_l3_codes": "T05-01-01", "ideology_l3_labels": "健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_02_01_02", "label": "利用骨传导原理制成的助听器", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_01", "paragraph_id": "EV_PEP8U_PHYSICS_02_01_02", "source_page": 36, "evidence_type": "社会生活与责任", "keyword": "利用骨传导原理制成的助听器", "textbook_original_excerpt": "而利用骨传导原理制成的助听器、耳机等更是在生活 中得到了广泛的应用。 想一想：我们梳头、刷牙、吃饼干时发出的各种声音是怎样传进大脑，产生 听觉的？", "ideology_l3_codes": "T05-01-01", "ideology_l3_labels": "健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_02_02_01", "label": "贾湖骨笛", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_02", "paragraph_id": "EV_PEP8U_PHYSICS_02_02_01", "source_page": 42, "evidence_type": "科学史与文化", "keyword": "贾湖骨笛", "textbook_original_excerpt": "在河南舞阳出土的  8 000 多年前的贾湖骨笛，可以吹奏出七声音阶，是 我国迄今发现的最早的管乐器（图 2.2-6） 。单簧管、 双簧管和各种号也是常见的管乐器", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_02_02_02", "label": "用自己制作的乐器进行演奏", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_02", "paragraph_id": "EV_PEP8U_PHYSICS_02_02_02", "source_page": 43, "evidence_type": "学科实践", "keyword": "用自己制作的乐器进行演奏", "textbook_original_excerpt": "在班里举行的小型音乐会上，用自己制作的乐器进行演奏，看看谁的乐器有新 意，谁演奏得好。写出你的制作过程，看看以下制作方案能否给你启发", "ideology_l3_codes": "T06-02-01;T06-01-03", "ideology_l3_labels": "证据推理;开放合作"}}, {"id": "EV_PEP8U_PHYSICS_02_03_01", "label": "超声波检测技术应用很广", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_03", "paragraph_id": "EV_PEP8U_PHYSICS_02_03_01", "source_page": 45, "evidence_type": "工程与科技应用", "keyword": "超声波检测技术应用很广", "textbook_original_excerpt": "在生产实践中，超声波检测技术应用很广。例 如，利用超声波可以检测出锅炉有没有裂纹，甚至还 可以知道裂纹有多大、多深", "ideology_l3_codes": "T03-03-03;T06-04-01", "ideology_l3_labels": "社会贡献;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_02_03_02", "label": "我国古代高水平的建筑声学成就", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_03", "paragraph_id": "EV_PEP8U_PHYSICS_02_03_02", "source_page": 47, "evidence_type": "科学史与文化", "keyword": "我国古代高水平的建筑声学成就", "textbook_original_excerpt": "圜丘等建筑反映出我国古代高水平的建筑声学成就。现在，人们也经常在设 计礼堂、音乐厅（图 2.3-10）等建筑时进行特别的声学设计，使听众听到的声音 更加 "degree": 4, "size": 9, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_05", "paragraph_id": "EV_PEP8U_PHYSICS_02_05_01", "source_page": 54, "evidence_type": "学科实践", "keyword": "材料是否易得、安全和环保", "textbook_original_excerpt": "展示交流 1. 展示你制作的隔音房间模型（图 2.5-2） ，并从 隔音性能，空间占用率，材料是否易得、安全和环保等 方面对模型进行评价。 2. 相互交流，总结经验并进行反思，尝试对制作 的模型进行改进", "ideology_l3_codes": "T06-01-03;T06-04-01;T10-02-03", "ideology_l3_labels": "开放合作;工程设计;可持续发展"}}, {"id": "EV_PEP8U_PHYSICS_02_05_02", "label": "为了做到不打扰他人", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_02_05", "paragraph_id": "EV_PEP8U_PHYSICS_02_05_02", "source_page": 54, "evidence_type": "社会生活与责任", "keyword": "为了做到不打扰他人", "textbook_original_excerpt": "如果有了真正的隔音房间，为了做到不打扰他 人，也为了自己听力的健康，在使用时还要注意哪些  问题？", "ideology_l3_codes": "T02-02-01;T05-01-01", "ideology_l3_labels": "公共责任;健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_03_01_01", "label": "分别测量冰箱的冷藏室和冷冻室", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_01", "paragraph_id": "EV_PEP8U_PHYSICS_03_01_01", "source_page": 61, "evidence_type": "社会生活与责任", "keyword": "分别测量冰箱的冷藏室和冷冻室", "textbook_original_excerpt": "请你选择合适的温度计，分别测量冰箱的冷藏室和冷冻室中不同位 置的温度，看看不同的食物适合放在冰箱的什么位置。 各种各样的温度计 人们为了判断身体是否发热，常常会测量体 温", "ideology_l3_codes": "T05-01-01;T02-02-01", "ideology_l3_labels": "健康知识理解;公共责任"}}, {"id": "EV_PEP8U_PHYSICS_03_01_02", "label": "电子体温计", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_01", "paragraph_id": "EV_PEP8U_PHYSICS_03_01_02", "source_page": 62, "evidence_type": "工程与科技应用", "keyword": "电子体温计", "textbook_original_excerpt": "现在的电子体温计通过液晶屏可以直接显 示体温（图 3.1-6）。 无论是玻璃体温计还是电子体温计，都要接触 人体，并需要一定的测量时间", "ideology_l3_codes": "T05-01-01;T06-04-01", "ideology_l3_labels": "健康知识理解;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_03_02_01", "label": "工业生产中常将钢水铸造成", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_02", "paragraph_id": "EV_PEP8U_PHYSICS_03_02_01", "source_page": 64, "evidence_type": "工程与科技应用", "keyword": "工业生产中常将钢水铸造成", "textbook_original_excerpt": "工业生产中常将钢水铸造成有一定形状的工件（图 3.2-1）。钢水在变成工件的过程中，它的状态发生了怎样的变化？在状态变化的过程中，钢水吸热还是放热？", "ideology_l3_codes": "T06-04-01;T06-02-01", "ideology_l3_labels": "工程设计;证据推理"}}, {"id": "EV_PEP8U_PHYSICS_03_02_02", "label": "注意避免烫伤", "group": "ideology_evidence", "degree": 4, "size": 9, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_02", "paragraph_id": "EV_PEP8U_PHYSICS_03_02_02", "source_page": 65, "evidence_type": "学科实践", "keyword": "注意避免烫伤", "textbook_original_excerpt": "注意避免烫伤", "ideology_l3_codes": "T02-02-01;T06-02-01;T02-03-03", "ideology_l3_labels": "公共责任;证据推理;国防与国家安全意识"}}, {"id": "EV_PEP8U_PHYSICS_03_02_03", "label": "在北方的冬天，为了很好地保存蔬菜", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_02", "paragraph_id": "EV_PEP8U_PHYSICS_03_02_03", "source_page": 68, "evidence_type": "社会生活与责任", "keyword": "在北方的冬天，为了很好地保存蔬菜", "textbook_original_excerpt": "在北方的冬天，为了很好地保存蔬菜，人们通常会在菜窖里放几桶水，这样可以利用水凝固成冰时放出的热使菜窖内的温度不会太低。", "ideology_l3_codes": "T06-02-01", "ideology_l3_labels": "证据推理"}}, {"id": "EV_PEP8U_PHYSICS_03_03_01", "label": "正确读取和记录实验数据", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_03", "paragraph_id": "EV_PEP8U_PHYSICS_03_03_01", "source_page": 71, "evidence_type": "学科实践", "keyword": "正确读取和记录实验数据", "textbook_original_excerpt": "证据 根据对问题的猜 想 ，设计实验方案 ， 选用相应的实验器材 进行实验 ，正确读取 和记录实验数据 。实 验数据是科学探究的 重要证据", "ideology_l3_codes": "T06-02-01;T02-02-01", "ideology_l3_labels": "证据推理;公共责任"}}, {"id": "EV_PEP8U_PHYSICS_03_03_02", "label": "水蒸气引起的烫伤", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_03", "paragraph_id": "EV_PEP8U_PHYSICS_03_03_02", "source_page": 74, "evidence_type": "社会生活与责任", "keyword": "水蒸气引起的烫伤", "textbook_original_excerpt": "烧水、做饭的时候，水蒸气引起的烫伤往往比开水 烫伤更严重，这是因为水蒸气和开水的温度虽然差不 多，但是水蒸气液化的时候还要放出大量的热", "ideology_l3_codes": "T05-01-01;T02-03-03", "ideology_l3_labels": "健康知识理解;国防与国家安全意识"}}, {"id": "EV_PEP8U_PHYSICS_03_03_03", "label": "我国的青藏铁路", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_03", "paragraph_id": "EV_PEP8U_PHYSICS_03_03_03", "source_page": 75, "evidence_type": "工程与科技应用", "keyword": "我国的青藏铁路", "textbook_original_excerpt": "我国的青藏铁路是世界上海拔最高的铁路。铁 路穿过多年冻土区时，为了减小冻土因融化对路基 产生的影响，需要使冻土保持低温", "ideology_l3_codes": "T02-01-01;T06-04-01", "ideology_l3_labels": "国家认同;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_03_04_01", "label": "共同保卫我们的蓝色家园", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_04", "paragraph_id": "EV_PEP8U_PHYSICS_03_04_01", "source_page": 79, "evidence_type": "社会生活与责任", "keyword": "共同保卫我们的蓝色家园", "textbook_original_excerpt": "因此，我们不仅需要改 进节水技术（图 3.4-5） 、优化用水 系统的运行，更需要每个人提高节 水意识、养成良好的用水习惯，共 同保卫我们的蓝色家园", "ideology_l3_codes": "T10-02-03", "ideology_l3_labels": "可持续发展"}}, {"id": "EV_PEP8U_PHYSICS_03_04_02", "label": "造成水资源的浪费", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_04", "paragraph_id": "EV_PEP8U_PHYSICS_03_04_02", "source_page": 80, "evidence_type": "社会生活与责任", "keyword": "造成水资源的浪费", "textbook_original_excerpt": "生活中，有很多情况会造成水资源的浪费。比如，水龙头漏水，用水后水龙头 未关紧，用水不节制等", "ideology_l3_codes": "T02-02-01", "ideology_l3_labels": "公共责任"}}, {"id": "EV_PEP8U_PHYSICS_03_05_01", "label": "优化烹饪过程或解决安全隐患", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_05", "paragraph_id": "EV_PEP8U_PHYSICS_03_05_01", "source_page": 82, "evidence_type": "社会生活与责任", "keyword": "优化烹饪过程或解决安全隐患", "textbook_original_excerpt": "进 一步说明这些建议是怎样优化烹饪过程或解决安全隐患 的，并解释这些建议的科学依据。还可以撰写一篇观察 报告，从物理学的视角分析物态变化规律在烹饪过程中 所起的作用，总结认识体会", "ideology_l3_codes": "T02-03-03", "ideology_l3_labels": "国防与国家安全意识"}}, {"id": "EV_PEP8U_PHYSICS_03_05_02", "label": "在家中实验前", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_03_05", "paragraph_id": "EV_PEP8U_PHYSICS_03_05_02", "source_page": 83, "evidence_type": "学科实践", "keyword": "在家中实验前", "textbook_original_excerpt": "在家中实验前， 请 确保 你处于安全 的操作环境中 ，并 能正确使用各种厨 具 ，家中还应有成 年人在场 ，操作时 须注意避免烫伤！", "ideology_l3_codes": "T02-03-03", "ideology_l3_labels": "国防与国家安全意识"}}, {"id": "EV_PEP8U_PHYSICS_04_01_01", "label": "神话终归是神话", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_01", "paragraph_id": "EV_PEP8U_PHYSICS_04_01_01", "source_page": 91, "evidence_type": "科学史与文化", "keyword": "神话终归是神话", "textbook_original_excerpt": "但是，神话终归是神话。你知道天上的牛郎星和织女星相距多远吗？", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_04_02_01", "label": "造成“光污染”", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_02", "paragraph_id": "EV_PEP8U_PHYSICS_04_02_01", "source_page": 96, "evidence_type": "社会生活与责任", "keyword": "造成“光污染”", "textbook_original_excerpt": "当强烈的太阳光照射到这些光 滑的表面时，就会发生镜面反射，炫目的光干扰人们的 正常生活，造成“光污染”", "ideology_l3_codes": "T05-01-01", "ideology_l3_labels": "健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_04_02_02", "label": "激光测距技术广泛应用", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_02", "paragraph_id": "EV_PEP8U_PHYSICS_04_02_02", "source_page": 97, "evidence_type": "工程与科技应用", "keyword": "激光测距技术广泛应用", "textbook_original_excerpt": "激光测距技术广泛应用在人造地球卫星测控、大地 测量等方面。例如，激光测距仪向目标天体发射激 光束，并接收反射回来的激光束，测出激光往返所 用的时间，就可以算出所测天体与地球之间的距离", "ideology_l3_codes": "T06-04-01", "ideology_l3_labels": "工程设计"}}, {"id": "EV_PEP8U_PHYSICS_04_03_01", "label": "古代人们就用磨光", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_03", "paragraph_id": "EV_PEP8U_PHYSICS_04_03_01", "source_page": 100, "evidence_type": "科学史与文化", "keyword": "古代人们就用磨光", "textbook_original_excerpt": "平面镜的应用 平面镜的使用历史悠久，古代人们就用磨光 的铜面作为镜子（图 4.3-4）", "ideology_l3_codes": "T04-01-01;T06-02-01", "ideology_l3_labels": "传统科技认知;证据推理"}}, {"id": "EV_PEP8U_PHYSICS_04_03_02", "label": "既节省燃料，又不污染环境", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_03", "paragraph_id": "EV_PEP8U_PHYSICS_04_03_02", "source_page": 101, "evidence_type": "社会生活与责任", "keyword": "既节省燃料，又不污染环境", "textbook_original_excerpt": "利用凹面镜制成的太阳灶（图 4.3-8） 可以会聚太阳光用来烧水、煮饭，既节省 燃料，又不污染环境。凹面镜的面积越 大，会聚的太阳光越多，温度也就越高", "ideology_l3_codes": "T10-02-03;T06-04-01", "ideology_l3_labels": "可持续发展;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_04_03_03", "label": "京剧被列入我国第一批国家级非物质文化遗产", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_03", "paragraph_id": "EV_PEP8U_PHYSICS_04_03_03", "source_page": 102, "evidence_type": "科学史与文化", "keyword": "京剧被列入我国第一批国家级非物质文化遗产", "textbook_original_excerpt": "京剧被列入我国第一批国家级非物质文化遗产名 录。请在图 4.3-9 中分别画出京剧演员通过平面镜 看到的 A 点和 B 点的像", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_04_04_01", "label": "《梦溪笔谈》", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_04", "paragraph_id": "EV_PEP8U_PHYSICS_04_04_01", "source_page": 105, "evidence_type": "科学史与文化", "keyword": "《梦溪笔谈》", "textbook_original_excerpt": "《梦溪笔谈》中都有关于海市蜃楼的记载，宋代大诗人 苏轼在《登州海市》诗中也描述过海市蜃楼的奇观。可见，海市蜃楼是一种不算 少见的自然现象", "ideology_l3_codes": "T04-01-01;T06-02-01", "ideology_l3_labels": "传统科技认知;证据推理"}}, {"id": "EV_PEP8U_PHYSICS_04_05_01", "label": "英国物理学家牛顿用玻璃三棱镜", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_05", "paragraph_id": "EV_PEP8U_PHYSICS_04_05_01", "source_page": 107, "evidence_type": "科学史与文化", "keyword": "英国物理学家牛顿用玻璃三棱镜", "textbook_original_excerpt": "直到 1666 年，英国物理学家牛顿用玻璃三棱镜分解了太阳 光，这才揭开了光的颜色之谜。  色散 人们早就学会将金刚石、水晶打磨成各种饰品", "ideology_l3_codes": "T06-02-01;T04-01-01", "ideology_l3_labels": "证据推理;传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_04_05_02", "label": "有助于诊断疾病", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_05", "paragraph_id": "EV_PEP8U_PHYSICS_04_05_02", "source_page": 109, "evidence_type": "社会生活与责任", "keyword": "有助于诊断疾病", "textbook_original_excerpt": "人生病的时 候，局部皮肤的温度异常，利用红外相机给皮肤拍照并 与健康人的照片（图 4.5-6）对比，有助于诊断疾病。 夜间人的体温比野外草木、岩石的温度高，人体辐射的 红外线比它们强", "ideology_l3_codes": "T05-01-01", "ideology_l3_labels": "健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_04_05_03", "label": "紫外线灯", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_04_05", "paragraph_id": "EV_PEP8U_PHYSICS_04_05_03", "source_page": 110, "evidence_type": "社会生活与责任", "keyword": "紫外线灯", "textbook_original_excerpt": "医院的手术室和病房里常配备紫外线灯 来灭菌，一些学校的餐厅也装有紫外线 灯，有的公交车也会采取紫外线灯封闭 照射的方式消毒（图 4.5-9） 。紫外线灯 一般会发出淡紫色的光", "ideology_l3_codes": "T05-01-01;T02-02-01", "ideology_l3_labels": "健康知识理解;公共责任"}}, {"id": "EV_PEP8U_PHYSICS_05_01_01", "label": "《淮南万毕术》", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_01", "paragraph_id": "EV_PEP8U_PHYSICS_05_01_01", "source_page": 117, "evidence_type": "科学史与文化", "keyword": "《淮南万毕术》", "textbook_original_excerpt": "《淮南万毕术》记载： “削冰令圆， 举以向日，以艾承其影，则火生。 ”这是利用冰透 镜对日聚焦取火的最早记载", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_05_01_02", "label": "瓶装水引发的", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_01", "paragraph_id": "EV_PEP8U_PHYSICS_05_01_02", "source_page": 117, "evidence_type": "社会生活与责任", "keyword": "瓶装水引发的", "textbook_original_excerpt": "调查发现，火灾是由放在仪表盘 上方防滑垫上的瓶装水引发的。瓶装水是怎样引发火灾的？", "ideology_l3_codes": "T02-03-03;T10-02-03", "ideology_l3_labels": "国防与国家安全意识;可持续发展"}}, {"id": "EV_PEP8U_PHYSICS_05_02_01", "label": "现在的照相机利用光学或电子技术", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_02", "paragraph_id": "EV_PEP8U_PHYSICS_05_02_01", "source_page": 118, "evidence_type": "工程与科技应用", "keyword": "现在的照相机利用光学或电子技术", "textbook_original_excerpt": "现在的照相机利用光学或电子技术， 把倒立的像转变成正立的，便于观察。 晶莹的露珠是大自然创造的“透镜” （图 5.2-1）", "ideology_l3_codes": "T06-04-01", "ideology_l3_labels": "工程设计"}}, {"id": "EV_PEP8U_PHYSICS_05_02_02", "label": "数码照相机用一种电荷耦合器件", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_02", "paragraph_id": "EV_PEP8U_PHYSICS_05_02_02", "source_page": 119, "evidence_type": "工程与科技应用", "keyword": "数码照相机用一种电荷耦合器件", "textbook_original_excerpt": "现在生活中常使用数码照相机，数码照 相机用一种电荷耦合器件作为感光元件代替胶片。这种 电荷耦合器件能把光信号转换成电信号，从而更方便地 记录物体的像", "ideology_l3_codes": "T06-04-01", "ideology_l3_labels": "工程设计"}}, {"id": "EV_PEP8U_PHYSICS_05_03_01", "label": "与各小组共享测量的数据", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_03", "paragraph_id": "EV_PEP8U_PHYSICS_05_03_01", "source_page": 123, "evidence_type": "学科实验与规律", "keyword": "与各小组共享测量的数据", "textbook_original_excerpt": "每个 小组可以自己选择适当的物距，并与各小组共享测量的数据", "ideology_l3_codes": "T06-01-03;T06-02-01", "ideology_l3_labels": "开放合作;证据推理"}}, {"id": "EV_PEP8U_PHYSICS_05_04_01", "label": "形成近视眼的原因", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_04", "paragraph_id": "EV_PEP8U_PHYSICS_05_04_01", "source_page": 127, "evidence_type": "社会生活与责任", "keyword": "形成近视眼的原因", "textbook_original_excerpt": "形成近视眼的原因是晶状体太厚，折光能力太强，或者 眼球在前后方向上太长，因此来自远处某点的光会聚在 视网膜前，到达视网膜时已经不是一点而是一个模糊的 光斑了（图 5.4-3 甲） 。利用凹透镜能使光发散的特点， 在眼睛前面放一个合适的凹透镜，就能使来自远处物体 的光会聚在视网膜上（图 5.4-3 乙 ）", "ideology_l3_codes": "T05-01-01", "ideology_l3_labels": "健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_05_04_02", "label": "全国爱眼日", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_04", "paragraph_id": "EV_PEP8U_PHYSICS_05_04_02", "source_page": 129, "evidence_type": "社会生活与责任", "keyword": "全国爱眼日", "textbook_original_excerpt": "6 月 6 日是全国爱眼日。根据你的观察和了解，生活中有哪些不当的用眼习惯会 导致近视？", "ideology_l3_codes": "T05-01-01", "ideology_l3_labels": "健康知识理解"}}, {"id": "EV_PEP8U_PHYSICS_05_05_01", "label": "同学之间相互评价", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "paragraph_id": "EV_PEP8U_PHYSICS_05_05_01", "source_page": 133, "evidence_type": "学科实践", "keyword": "同学之间相互评价", "textbook_original_excerpt": "同学之间相互评价，比一比 谁的望远镜更完善", "ideology_l3_codes": "T06-01-03;T06-04-01", "ideology_l3_labels": "开放合作;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_05_05_02", "label": "确凿的证据支持了哥白尼", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "paragraph_id": "EV_PEP8U_PHYSICS_05_05_02", "source_page": 134, "evidence_type": "科学史与文化", "keyword": "确凿的证据支持了哥白尼", "textbook_original_excerpt": "1609 年，伽利略用自制的望远镜观察天体（图 5.5-7） ，以确凿的证据支持了哥白尼的“日心说” 。 他还第一个观察到了木星的卫星、太阳黑子和月球 上的环形山", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_05_05_03", "label": "我国不仅古代在天文", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "paragraph_id": "EV_PEP8U_PHYSICS_05_05_03", "source_page": 134, "evidence_type": "科学史与文化", "keyword": "我国不仅古代在天文", "textbook_original_excerpt": "我国不仅古代在天文 观测上取得了丰硕的成果， 在现代也对宇宙探索作出 了很大贡献 。 2009 年， 郭 守敬望远镜建成 ，并于 2011年启动光谱巡天任务， 成为世界上第一个获取光 谱数突破千万量级的望远 镜（图5.5-8）", "ideology_l3_codes": "T04-01-01;T02-01-01", "ideology_l3_labels": "传统科技认知;国家认同"}}, {"id": "EV_PEP8U_PHYSICS_05_05_04", "label": "中国天眼", "group": "ideology_evidence", "degree": 4, "size": 9, "data": {"section_id": "SEC_PEP8U_PHYSICS_05_05", "paragraph_id": "EV_PEP8U_PHYSICS_05_05_04", "source_page": 134, "evidence_type": "工程与科技应用", "keyword": "中国天眼", "textbook_original_excerpt": "2020年，中国天眼正式开放运行", "ideology_l3_codes": "T02-03-02;T02-01-01;T06-04-01", "ideology_l3_labels": "科技报国;国家认同;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_06_01_01", "label": "战国时期的天平", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "paragraph_id": "EV_PEP8U_PHYSICS_06_01_01", "source_page": 139, "evidence_type": "科学史与文化", "keyword": "战国时期的天平", "textbook_original_excerpt": "图 6.1-1 战国时期的天平", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_06_01_02", "label": "我国曾经用斤、两、钱", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "paragraph_id": "EV_PEP8U_PHYSICS_06_01_02", "source_page": 142, "evidence_type": "规范与标准", "keyword": "我国曾经用斤、两、钱", "textbook_original_excerpt": "自古以来，各国采用过各种不同的质量单位。例如，我国曾经用斤、两、钱作为质量单位，英、美等国曾经用磅作为质量单位。", "ideology_l3_codes": "T08-01-03;T02-02-01", "ideology_l3_labels": "国际标准认知;公共责任"}}, {"id": "EV_PEP8U_PHYSICS_06_01_03", "label": "第 26 届国际计量大会决定更新千克的定义", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_01", "paragraph_id": "EV_PEP8U_PHYSICS_06_01_03", "source_page": 143, "evidence_type": "规范与标准", "keyword": "第 26 届国际计量大会决定更新千克的定义", "textbook_original_excerpt": "2018 年，第 26 届国际计量大会决定更新千克的定义，在 不使用具体实物的情况下定义了质量单位", "ideology_l3_codes": "T08-01-03;T02-02-01", "ideology_l3_labels": "国际标准认知;公共责任"}}, {"id": "EV_PEP8U_PHYSICS_06_02_01", "label": "通过所作的图像", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "paragraph_id": "EV_PEP8U_PHYSICS_06_02_01", "source_page": 145, "evidence_type": "学科实验与规律", "keyword": "通过所作的图像", "textbook_original_excerpt": "通过所作的图像，可以直观地 看到铝块的质量与体积的关系。你从中能得出什么结论？", "ideology_l3_codes": "T06-02-01", "ideology_l3_labels": "证据推理"}}, {"id": "EV_PEP8U_PHYSICS_06_02_02", "label": "冬天对自来水管的保护", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_02", "paragraph_id": "EV_PEP8U_PHYSICS_06_02_02", "source_page": 147, "evidence_type": "社会生活与责任", "keyword": "冬天对自来水管的保护", "textbook_original_excerpt": "在我国的北方，冬天对自来水管的保护十分重要。如果保护不好，水管内的 水结了冰，不仅影响正常的生活用水，有时还会把水管冻裂，造成设备的损坏", "ideology_l3_codes": "T02-03-03", "ideology_l3_labels": "国防与国家安全意识"}}, {"id": "EV_PEP8U_PHYSICS_06_03_01", "label": "为了选出饱满的种粒", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "paragraph_id": "EV_PEP8U_PHYSICS_06_03_01", "source_page": 149, "evidence_type": "社会生活与责任", "keyword": "为了选出饱满的种粒", "textbook_original_excerpt": "例如，为了选出饱满的种粒，可以配制适当密度的 盐水进行选种。将种粒浸没在盐水中并适当搅拌，静置 一段时间后，清除水面漂浮的空粒、瘪粒，就可以选出 较好的种子（图 6.3-1）", "ideology_l3_codes": "T03-03-03", "ideology_l3_labels": "社会贡献"}}, {"id": "EV_PEP8U_PHYSICS_06_03_02", "label": "虽经多次重复测量", "group": "ideology_evidence", "degree": 4, "size": 9, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_03", "paragraph_id": "EV_PEP8U_PHYSICS_06_03_02", "source_page": 150, "evidence_type": "科学史与文化", "keyword": "虽经多次重复测量", "textbook_original_excerpt": "虽经多次重复测量，但仍然存在这个令人奇怪的差异。 后来，他与化学家拉姆塞合作，于 1894 年在从空气中取得的氮里，分离出另 一种当时还不知道的气体——氩，这个谜才解开了", "ideology_l3_codes": "T06-02-01;T06-01-03;T04-01-01", "ideology_l3_labels": "证据推理;开放合作;传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_06_04_01", "label": "矗立在天安门广场的人民英雄纪念碑", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "paragraph_id": "EV_PEP8U_PHYSICS_06_04_01", "source_page": 152, "evidence_type": "社会生活与责任", "keyword": "矗立在天安门广场的人民英雄纪念碑", "textbook_original_excerpt": "矗立在天安门广场的人民英雄纪念碑（图 6.4-1），碑身高 37.94 m，由 413 块花岗岩石块砌成。碑心石由一整块花岗岩经多次加工而成，当这块花岗岩被加工成长 14.7 m、宽 2.9 m、厚 1.0 m 的长方体巨石时，它的质量约为多少？", "ideology_l3_codes": "T02-01-01", "ideology_l3_labels": "国家认同"}}, {"id": "EV_PEP8U_PHYSICS_06_04_02", "label": "海上风力发电机", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "paragraph_id": "EV_PEP8U_PHYSICS_06_04_02", "source_page": 154, "evidence_type": "工程与科技应用", "keyword": "海上风力发电机", "textbook_original_excerpt": "超过百米的海上风力发电机的叶片采用了具有密度 小、强度高、耐腐蚀、抗疲劳等优异性能的碳纤维材料  （图 6.4-4）", "ideology_l3_codes": "T10-02-03;T06-04-01", "ideology_l3_labels": "可持续发展;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_06_04_03", "label": "我国是世界上冶铁业出现较早", "group": "ideology_evidence", "degree": 2, "size": 7, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "paragraph_id": "EV_PEP8U_PHYSICS_06_04_03", "source_page": 155, "evidence_type": "科学史与文化", "keyword": "我国是世界上冶铁业出现较早", "textbook_original_excerpt": "我国是世界上冶铁业出现较早的国家之一。春 秋战国时代，由铁制作的农具、手工工具及各种兵 器得以广泛应用", "ideology_l3_codes": "T04-01-01", "ideology_l3_labels": "传统科技认知"}}, {"id": "EV_PEP8U_PHYSICS_06_04_04", "label": "我国自主研发的“手撕钢”", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "paragraph_id": "EV_PEP8U_PHYSICS_06_04_04", "source_page": 155, "evidence_type": "工程与科技应用", "keyword": "我国自主研发的“手撕钢”", "textbook_original_excerpt": "随着我国工业技术的发展，目前，我国自主研发的 “手撕钢”比纸还要薄（图 6.4-6） ，被不断应用到许多高新技术领域。 20 世纪，各种新材料层出不穷", "ideology_l3_codes": "T02-01-01;T06-04-01", "ideology_l3_labels": "国家认同;工程设计"}}, {"id": "EV_PEP8U_PHYSICS_06_04_05", "label": "黄河铁牛", "group": "ideology_evidence", "degree": 3, "size": 8, "data": {"section_id": "SEC_PEP8U_PHYSICS_06_04", "paragraph_id": "EV_PEP8U_PHYSICS_06_04_05", "source_page": 156, "evidence_type": "科学史与文化", "keyword": "黄河铁牛", "textbook_original_excerpt": "我国唐代的“黄河铁牛”是世界桥梁史上的瑰宝，巨大的铁牛（图 6.4-8）起到固定索桥的作用。", "ideology_l3_codes": "T04-01-01;T06-04-01", "ideology_l3_labels": "传统科技认知;工程设计"}}, {"id": "T01", "label": "政治认同", "group": "tag_l1", "degree": 3, "size": 8, "data": {"l1_code": "T01", "l1_label": "政治认同"}}, {"id": "T02", "label": "家国责任", "group": "tag_l1", "degree": 3, "size": 8, "data": {"l1_code": "T02", "l1_label": "家国责任"}}, {"id": "T03", "label": "经世济民", "group": "tag_l1", "degree": 3, "size": 8, "data": {"l1_code": "T03", "l1_label": "经世济民"}}, {"id": "T04", "label": "文化素养", "group": "tag_l1", "degree": 3, "size": 8, "data": {"l1_code": "T04", "l1_label": "文化素养"}}, {"id": "T05", "label": "健康教育", "group": "tag_l1", "degree": 3, "size": 8, "data": {"l1_code": "T05", "l1_label": "健康教育"}}, {"id": "T06", "label": "科学创新", "group": "tag_l1", "degree": 4, "size": 9, "data": {"l1_code": "T06", "l1_label": "科学创新"}}, {"id": "T07", "label": "智能素养", "group":
